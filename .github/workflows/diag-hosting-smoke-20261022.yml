name: Diagnostic - MusicScale Public Hosting
on:
  push:
    branches:
      - chatgpt/diag-hosting-smoke-20261022
permissions:
  contents: read
jobs:
  http-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check official and Firebase public URLs without credentials
        shell: bash
        run: |
          set -u
          for base in https://mn-musicscale-555464791734.web.app https://musicscale.millionsnest.com; do
            for path in / /start /stage-tools/tuner /version.json; do
              echo "===== ${base}${path} ====="
              h="$(mktemp)"; b="$(mktemp)"
              rc=0
              status="$(curl --silent --show-error --location --max-time 20 --dump-header "$h" --output "$b" --write-out '%{http_code}' "${base}${path}?smoke=diagnostic" 2>&1)" || rc=$?
              echo "curl_exit=$rc status=$status"
              grep -iE '^(HTTP/|cache-control:|content-type:|location:|x-served-by:|server:)' "$h" | head -20 || true
              if [ "$path" = /version.json ]; then
                head -c 150 "$b" || true
                echo
              else
                echo "body_bytes=$(wc -c < "$b")"
                echo "html=$(grep -iEq '<!doctype html|<html' "$b" && echo yes || echo no)"
              fi
              rm -f "$h" "$b"
            done
          done

      - name: Check independent NestTuner asset and protected MusicScale API response
        shell: bash
        run: |
          set -u
          for url in \
            'https://mn-nesttuner-555464791734.web.app/pt/?embed=musicscale&version=0.6.7-beta.1' \
            'https://mn-nesttuner-555464791734.web.app/embed/nesttuner-element.v0.6.7-beta.1.js' \
            'https://musicscale.millionsnest.com/api/v1/ecosystem/access-context?organizationId=production-release-smoke'; do
            echo "===== $url ====="
            h="$(mktemp)"; b="$(mktemp)"
            rc=0
            status="$(curl --silent --show-error --location --max-time 20 --dump-header "$h" --output "$b" --write-out '%{http_code}' "$url" 2>&1)" || rc=$?
            echo "curl_exit=$rc status=$status"
            grep -iE '^(HTTP/|cache-control:|content-type:|location:)' "$h" | head -12 || true
            echo "body_bytes=$(wc -c < "$b")"
            head -c 160 "$b" || true
            echo
            rm -f "$h" "$b"
          done
