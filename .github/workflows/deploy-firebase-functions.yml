name: Deploy Firebase Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firebase-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    environment: firebase-production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Functions Dependencies
        working-directory: ./functions
        run: npm ci

      - name: Build Functions
        working-directory: ./functions
        run: npm run build

      - name: Verify Compiled Exports
        working-directory: ./functions
        run: |
          node -e "
            import('./dist/index.js').then(m => {
              const required = ['onLocalSongWritten', 'onBandScaleWritten', 'onSuggestionCreated'];
              for (const req of required) {
                if (typeof m[req] !== 'function') {
                  console.error('Missing compiled export: ' + req);
                  process.exit(1);
                }
              }
              console.log('All required exports are present.');
            }).catch(err => {
              console.error('Failed to load compiled module:', err);
              process.exit(1);
            });
          "

      - name: Inject DEPLOY_VERSION
        working-directory: ./functions
        run: echo "GITHUB_SHA=${{ github.sha }}" >> .env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MILLIONSNEST }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Functions
        run: firebase deploy --only functions:onLocalSongWritten,functions:onBandScaleWritten,functions:onSuggestionCreated --project millionsnest --non-interactive

      - name: Verify Post-Deploy
        run: |
          echo "Commit implantado: ${{ github.sha }}"
          echo "Projeto Firebase: millionsnest"
          echo "Listing deployed functions for project millionsnest..."
          firebase functions:list --project millionsnest > functions_list.txt
          cat functions_list.txt
          
          declare -a required=("onLocalSongWritten" "onBandScaleWritten" "onSuggestionCreated")
          for func in "${required[@]}"; do
            if ! grep -q "$func" functions_list.txt; then
              echo "Error: $func not found in deployed functions list."
              exit 1
            fi
            echo "Verification passed: $func is deployed."
          done
          echo "All required functions verified post-deploy."

