name: MusicScale Final Membership Hardening 02E Certification

on:
  push:
    branches:
      - "certify/ms-final-membership-hardening-02e"
    paths:
      - ".github/workflows/ms-final-membership-hardening-02e-certification.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "e143cef3c0786e1bf1e2b109f3d4a0a3976d90bf"
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact feature head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e143cef3c0786e1bf1e2b109f3d4a0a3976d90bf"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: 02E client authority migration guard
        run: npx vitest run tests/server/music-scale-membership-authority-migration-02e.test.ts
      - name: 02E membership Rules real Emulator
        run: npx firebase emulators:exec --project demo-musicscale-membership-authority-02e --only firestore "npx vitest run tests/server/music-scale-membership-authority-rules-02e.test.ts"
      - name: Existing security Rules real Emulator regression
        run: npx firebase emulators:exec --project demo-musicscale-rules --only firestore "npx vitest run tests/server/music-scale-security-rules.test.ts"
      - name: 02C and 02D command adapter regressions
        run: npx vitest run tests/server/hub-join-request-adapter-02c.test.ts tests/server/music-scale-join-request-compatibility-02c.test.ts tests/server/music-scale-join-request-migration-02c.test.ts tests/server/hub-member-removal-adapter-02d.test.ts tests/server/music-scale-member-removal-compatibility-02d.test.ts tests/server/music-scale-member-removal-migration-02d.test.ts
      - name: 02A and 02B security regressions
        run: npx vitest run tests/server/music-scale-member-projection.test.ts tests/server/hub-invitation-adapter-02b.test.ts tests/server/music-scale-invitation-compatibility-02b2.test.ts
      - name: Team management UI regressions
        run: npx vitest run tests/ui/users-existing-member-setup-integration.test.tsx tests/ui/users-team-setup-progress-integration.test.tsx
      - name: AI authorization regression
        run: npx tsx scripts/test_phase0_2c1a_ai_authorization.ts
      - name: Lint typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Hygiene
        run: |
          set -euo pipefail
          git diff --check
          test "$(git rev-parse HEAD)" = "e143cef3c0786e1bf1e2b109f3d4a0a3976d90bf"
          test -z "$(git status --porcelain)"
