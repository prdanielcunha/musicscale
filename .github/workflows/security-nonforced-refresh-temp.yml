name: Temporary Non-Forced Security Lock Refresh

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'chatgpt/security-nonforced-lock-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Snapshot manifest
        run: cp package.json /tmp/package.json.before

      - name: Apply non-forced package-lock-only security refresh
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          cmp --silent package.json /tmp/package.json.before || {
            echo 'package.json changed unexpectedly' >&2
            exit 1
          }

      - name: Require zero high and critical production vulnerabilities
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/audit-prod.json', 'utf8'));
          const v = report.metadata?.vulnerabilities || {};
          console.log('Production vulnerability summary:', v);
          if ((v.critical ?? -1) !== 0 || (v.high ?? -1) !== 0) {
            throw new Error(`Expected 0 critical/high vulnerabilities, got critical=${v.critical}, high=${v.high}`);
          }
          NODE

      - name: Verify key patched versions
        shell: bash
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const expected = {
            'node_modules/websocket-driver': '0.7.5',
            'node_modules/react-router-dom': '7.18.2',
            'node_modules/react-router': '7.18.2',
            'node_modules/vite': '6.4.3',
            'node_modules/@grpc/grpc-js': '1.9.16',
            'node_modules/protobufjs': '7.6.5',
            'node_modules/postcss': '8.5.26',
            'node_modules/nanoid': '3.3.18',
            'node_modules/undici': '7.29.0'
          };
          for (const [name, version] of Object.entries(expected)) {
            const actual = lock.packages?.[name]?.version;
            if (actual !== version) throw new Error(`${name}: expected ${version}, got ${actual}`);
          }
          NODE

      - name: Show lockfile-only scope
        run: git diff --stat && git diff --name-only

      - name: Remove temporary workflow and commit lock refresh
        shell: bash
        run: |
          rm .github/workflows/security-nonforced-refresh-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/security-nonforced-refresh-temp.yml
          git commit -m 'fix(security): refresh patched dependency lock'
          git push origin HEAD:${{ github.head_ref }}
