name: MusicScale Apply Global Member Role Recovery
on:
  push:
    branches: [ production ]
    paths:
      - '.github/workflows/apply-member-role-recovery.yml'
      - 'scripts/apply-member-role-recovery.ts'
permissions:
  contents: read
  id-token: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/github-musicscale-p47/providers/github-production
          audience: //iam.googleapis.com/projects/555464791734/locations/global/workloadIdentityPools/github-musicscale-p47/providers/github-production
      - name: Apply safe global member role recovery
        env:
          FIREBASE_PROJECT_ID: millionsnest
          GCLOUD_PROJECT: millionsnest
          GOOGLE_CLOUD_PROJECT: millionsnest
        run: npx tsx scripts/apply-member-role-recovery.ts
