name: MusicScale Aggregate Role and Band Integrity Audit
on:
  push:
    branches: [production]
    paths:
      - '.github/workflows/music-data-integrity-aggregate.yml'
      - 'scripts/audit-production-integrity-aggregate.ts'
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
jobs:
  aggregate-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: firebase-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/github-musicscale-p47/providers/github-production
          audience: //iam.googleapis.com/projects/555464791734/locations/global/workloadIdentityPools/github-musicscale-p47/providers/github-production
      - name: Count integrity anomalies without writing or exporting personal records
        env:
          FIREBASE_PROJECT_ID: millionsnest
          GCLOUD_PROJECT: millionsnest
          GOOGLE_CLOUD_PROJECT: millionsnest
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        run: npx tsx scripts/audit-production-integrity-aggregate.ts
