name: MusicScale Main Firebase Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: musicscale-main-firebase-preview-${{ github.event_name }}
  cancel-in-progress: true

env:
  PROJECT_ID: millionsnest
  PREVIEW_CHANNEL: main-review

jobs:
  main-preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build MusicScale main bundle
        run: |
          npm run build
          test -f dist/index.html

      - name: Dispatch authenticated Firebase preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-main-preview.yml/dispatches" \
            -f ref='production'

      - name: Publish handoff status
        run: |
          {
            echo '## MusicScale main preview'
            echo
            echo 'Main compiled successfully.'
            echo 'The Firebase preview deployment was dispatched through the production-trusted WIF context.'
            echo 'This workflow never deploys the live Firebase Hosting channel.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-main-preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - name: Checkout latest main for homologation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Record main SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies before cloud authentication
        run: npm ci --no-audit --no-fund

      - name: Build MusicScale main bundle before cloud authentication
        run: |
          npm run build
          test -f dist/index.html

      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - name: Install pinned Firebase CLI
        run: npm install -g firebase-tools@15.25.1

      - name: Deploy only the temporary Firebase Hosting preview channel
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          firebase hosting:channel:deploy "$PREVIEW_CHANNEL" \
            --project "$PROJECT_ID" \
            --only musicscale \
            --expires 7d \
            --non-interactive 2>&1 | tee /tmp/firebase-preview.log

          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.web\.app' /tmp/firebase-preview.log | head -n 1 || true)"
          if [ -z "$PREVIEW_URL" ]; then
            echo 'Firebase CLI did not expose a .web.app preview URL.' >&2
            cat /tmp/firebase-preview.log >&2
            exit 1
          fi

          case "$PREVIEW_URL" in
            https://*.web.app) ;;
            *) echo "Unexpected preview URL: $PREVIEW_URL" >&2; exit 1 ;;
          esac

          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Verify preview is isolated from official hosting
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          HEADERS="$(mktemp)"
          BODY="$(mktemp)"
          STATUS="$(curl --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors \
            --dump-header "$HEADERS" --output "$BODY" --write-out '%{http_code}' \
            "$PREVIEW_URL/")"
          test "$STATUS" = '200'
          grep -Eiq '<!doctype html|<html' "$BODY"
          if grep -Eiq '^location: https://musicscale\.millionsnest\.com' "$HEADERS"; then
            echo 'Preview unexpectedly redirects to the official MusicScale domain.' >&2
            exit 1
          fi

      - name: Publish verified Firebase preview URL
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          MAIN_SHA: ${{ steps.source.outputs.sha }}
        run: |
          {
            echo '## MusicScale Firebase main preview'
            echo
            echo "**Main SHA:** \`$MAIN_SHA\`"
            echo "**Preview:** $PREVIEW_URL"
            echo
            echo 'This is the temporary Firebase Hosting channel `main-review`.'
            echo 'No live Hosting deploy command exists in this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
