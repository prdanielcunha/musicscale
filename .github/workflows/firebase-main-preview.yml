name: MusicScale Main Preview Preflight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musicscale-main-preview-preflight
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build MusicScale preview bundle
        run: |
          npm run build
          test -f dist/index.html

      - name: Upload certified preview bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musicscale-main-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

      - name: Publish preflight status
        run: |
          {
            echo '## MusicScale main preview preflight'
            echo
            echo 'Main bundle built successfully and was stored as a short-lived CI artifact.'
            echo
            echo 'Firebase Hosting preview deployment is intentionally not attempted from `main` because the existing MillionsNest WIF provider is restricted to `refs/heads/production`.'
            echo 'That production IAM boundary remains unchanged. Use a single manual preview deployment for UI/UX validation until a dedicated non-production WIF provider exists.'
          } >> "$GITHUB_STEP_SUMMARY"
