name: Apply Draft Lifecycle Hotfix

on:
  push:
    branches:
      - chatgpt/hotfix-draft-lifecycle-20260912
    paths:
      - 'scripts/apply-draft-lifecycle-hotfix.mjs'
      - 'scripts/apply-draft-lifecycle-hotfix-v2.mjs'
      - 'scripts/apply-draft-lifecycle-hotfix-v3.mjs'
      - '.github/workflows/hotfix-draft-lifecycle-apply.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: ${{ !contains(github.event.head_commit.message, '[hotfix-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/hotfix-draft-lifecycle-20260912
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic source transformations
        run: node scripts/apply-draft-lifecycle-hotfix-v3.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript gate
        run: npm run lint

      - name: Dashboard regression gate
        run: npm run test:scale-dashboard

      - name: MusicScale publish cycle gate
        run: npm run test:scale-cycle

      - name: Build gate
        run: npm run build

      - name: Commit validated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/scales/ModernScaleForm.tsx components/dashboard/HomeFocusCard.tsx services/MusicRepository.ts contexts/ModalContext.tsx
          git commit -m "fix: draft deletion and publish resilience [hotfix-applied]"
          git push origin HEAD:chatgpt/hotfix-draft-lifecycle-20260912
