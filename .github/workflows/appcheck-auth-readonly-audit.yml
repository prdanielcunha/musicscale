name: P0 App Check and Auth Read-only Audit

on:
  push:
    branches: [ production ]
    paths:
      - '.github/workflows/appcheck-auth-readonly-audit.yml'
      - 'scripts/audit-appcheck-auth-readonly.py'
      - 'ops/appcheck-audit-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: firebase-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Authenticate using existing production deploy identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com
      - name: Read sanitized configuration checks without customer data
        run: python3 scripts/audit-appcheck-auth-readonly.py
