name: ChatGPT Firestore Read-only Audit

on:
  push:
    branches: [ production ]
    paths:
      - '.github/workflows/chatgpt-firestore-readonly-audit.yml'
      - 'scripts/export-global-song-catalog-readonly.ts'
      - 'ops/firestore-audit-trigger.txt'
      - '.github/workflows/cloudrun-private-deploy.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: musicscale-chatgpt-firestore-readonly-audit
  cancel-in-progress: false

jobs:
  export_catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Authenticate to Google Cloud with existing production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/github-musicscale-p47/providers/github-production
          audience: //iam.googleapis.com/projects/555464791734/locations/global/workloadIdentityPools/github-musicscale-p47/providers/github-production

      - name: Export sanitized globalSongs catalog (read-only)
        env:
          FIREBASE_PROJECT_ID: millionsnest
          GCLOUD_PROJECT: millionsnest
          GOOGLE_CLOUD_PROJECT: millionsnest
        run: npx tsx scripts/export-global-song-catalog-readonly.ts

      - name: Upload sanitized audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musicscale-globalSongs-catalog-${{ github.run_id }}
          path: tmp/firestore-audit/globalSongs.catalog.json
          if-no-files-found: error
          retention-days: 7
