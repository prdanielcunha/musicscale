name: MusicScale Final Client Membership Write Audit 02E

on:
  push:
    branches:
      - "certify/ms-final-client-write-audit-02e"
    paths:
      - ".github/workflows/ms-final-client-write-audit-02e.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "e143cef3c0786e1bf1e2b109f3d4a0a3976d90bf"
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact feature head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e143cef3c0786e1bf1e2b109f3d4a0a3976d90bf"
          test -z "$(git status --porcelain)"
      - name: Audit reachable client membership authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('pages'), Path('components'), Path('contexts')]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(root.rglob('*.ts'))
                  files.extend(root.rglob('*.tsx'))

          failures = []
          for path in sorted(set(files)):
              text = path.read_text(errors='replace')
              rel = str(path)

              if 'organization_join_requests' in text:
                  failures.append(f'{rel}: legacy organization_join_requests reference')
              if 'handleMigrateRoles' in text or 'Migrar Estrutura de Papéis (Admin)' in text:
                  failures.append(f'{rel}: legacy role migration authority')

              for m in re.finditer(r'(?P<fn>setDoc|updateDoc|deleteDoc)\s*\((?P<body>.{0,450}?)\)', text, re.S):
                  body = m.group('body')
                  if ('members' in body and 'organizations' in body) or 'organization_members' in body:
                      failures.append(f'{rel}: {m.group("fn")} membership mutation')

              if re.search(r'batch\.(set|update|delete)\s*\(.{0,300}organization_members', text, re.S):
                  failures.append(f'{rel}: batch legacy membership mutation')
              if 'organizationRole: "owner"' in text or "organizationRole: 'owner'" in text:
                  if any(token in text for token in ['setDoc(', 'addDoc(', 'batch.set(', 'updateDoc(']):
                      failures.append(f'{rel}: client owner-membership authority marker')

          profile = Path('pages/ProfilePage.tsx').read_text()
          users = Path('pages/UsersPage.tsx').read_text()
          sidebar = Path('components/layout/Sidebar.tsx').read_text()
          diagnostics = Path('components/admin/EcosystemDiagnostics.tsx').read_text()

          required = {
              'ProfilePage canonical join endpoint': '/join-requests/${encodeURIComponent(requestId)}/${action}' in profile,
              'ProfilePage canonical removal endpoint': '/members/${encodeURIComponent(memberId)}' in profile and "method: 'DELETE'" in profile,
              'UsersPage canonical removal endpoint': '/members/${encodeURIComponent(memberId)}' in users and 'method: "DELETE"' in users,
              'Sidebar canonical join query': "collection(db, 'organizations', userProfile.organizationId, 'join_requests')" in sidebar,
              'Diagnostics owner link delegated': 'OWNER_LINK_REQUIRES_MILLIONSNEST_HUB' in diagnostics,
              'Diagnostics org creation delegated': 'ORGANIZATION_CREATION_REQUIRES_MILLIONSNEST_HUB' in diagnostics,
          }
          failures.extend(name for name, ok in required.items() if not ok)

          if failures:
              print('CLIENT_MEMBERSHIP_AUTHORITY_AUDIT_FAILURE')
              for failure in failures:
                  print(f'- {failure}')
              raise SystemExit(1)

          print(f'CLIENT_MEMBERSHIP_AUTHORITY_AUDIT_PASS files_scanned={len(set(files))}')
          PY
      - name: Hygiene
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e143cef3c0786e1bf1e2b109f3d4a0a3976d90bf"
          test -z "$(git status --porcelain)"
