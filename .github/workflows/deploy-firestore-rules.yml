name: Deploy Firestore Rules

on:
  push:
    branches:
      - production
    paths:
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    steps:
      - name: Guard shared Firestore authority
        run: |
          echo 'MusicScale does not own the shared MillionsNest Firestore Rules release.'
          echo 'Canonical shared rules are owned and deployed only by prdanielcunha/millionsnest.'
          echo 'MUSICSCALE_SHARED_FIRESTORE_DEPLOY_BLOCKED_OK'
