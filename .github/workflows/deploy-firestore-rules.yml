name: Deploy Firestore Rules

on:
  workflow_dispatch:
    inputs:
      smoke_only:
        description: 'Authenticate with OIDC only; never deploy Firebase resources'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    environment: firebase-production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup npm install
        run: npm install -g firebase-tools

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/ms-rules-prod-v1/providers/github
          service_account: ms-rules-prod-wif-v1@millionsnest.iam.gserviceaccount.com
          audience: //iam.googleapis.com/projects/555464791734/locations/global/workloadIdentityPools/ms-rules-prod-v1/providers/github

      - name: OIDC authentication smoke
        if: inputs.smoke_only
        run: |
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud auth print-access-token >/dev/null
          echo 'OIDC authentication smoke passed; no Firebase deployment was requested.'

      - name: Deploy Firestore Rules
        if: inputs.smoke_only != true
        run: firebase deploy --only firestore:rules --project millionsnest --non-interactive
