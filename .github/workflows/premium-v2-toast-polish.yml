name: Premium V2 Toast Polish

on:
  push:
    branches:
      - feat/premium-v2-operational-surfaces-20260913
    paths:
      - .github/workflows/premium-v2-toast-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-v2-operational-surfaces-20260913
          fetch-depth: 0

      - name: Apply visual-only toast polish
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('contexts/ToastContext.tsx')
          text = path.read_text()

          replacements = [
            (
              'className="pointer-events-auto bg-white/95 dark:bg-[#1C1C1E]/95 sm:bg-white/80 sm:dark:bg-[#1C1C1E]/80 sm:backdrop-blur-2xl border border-black/5 dark:border-white/10 shadow-[0_8px_30px_rgba(0,0,0,0.12)] px-4 py-2.5 rounded-full flex items-center gap-2.5 max-w-[90vw]"',
              'className="pointer-events-auto bg-[#121217]/98 border border-white/[0.09] shadow-[0_16px_46px_-22px_rgba(0,0,0,0.9),inset_0_1px_0_rgba(255,255,255,0.04)] px-4 py-2.5 rounded-[14px] flex items-center gap-2.5 max-w-[90vw]"'
            ),
            (
              '<div className="absolute inset-0 hidden sm:block bg-white/60 dark:bg-[#111111]/80 backdrop-blur-2xl -z-10"></div>\n\n',
              ''
            ),
            (
              '{toastItem.type === "feedback" && <span className="text-lg">👋</span>}',
              '{toastItem.type === "feedback" && <Info className="w-5 h-5" />}'
            ),
          ]

          for before, after in replacements:
            count = text.count(before)
            if count != 1:
              raise SystemExit(f'Expected exactly one toast anchor, found {count}: {before[:100]}')
            text = text.replace(before, after, 1)

          path.write_text(text)
          Path('.github/workflows/premium-v2-toast-polish.yml').unlink()
          PY

      - name: Verify scoped visual diff
        run: |
          git diff --check
          grep -F 'bg-[#121217]/98' contexts/ToastContext.tsx
          test "$(grep -o 'backdrop-blur-2xl' contexts/ToastContext.tsx | wc -l)" -eq 0
          test "$(grep -o '👋' contexts/ToastContext.tsx | wc -l)" -eq 0
          grep -F 'toastItem.type === "feedback" && <Info className="w-5 h-5" />' contexts/ToastContext.tsx
          git diff -- contexts/ToastContext.tsx

      - name: Commit polish and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contexts/ToastContext.tsx .github/workflows/premium-v2-toast-polish.yml
          git commit -m "feat: align toasts with Premium V2 surfaces"
          git push origin HEAD:feat/premium-v2-operational-surfaces-20260913
