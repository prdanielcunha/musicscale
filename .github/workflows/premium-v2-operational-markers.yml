name: Premium V2 Operational Surface Markers

on:
  push:
    branches:
      - feat/premium-v2-operational-surfaces-20260913
    paths:
      - .github/workflows/premium-v2-operational-markers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-v2-operational-surfaces-20260913
          fetch-depth: 0

      - name: Add visual scope markers only
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'pages/NotificationsPage.tsx': [
              ('<div className="w-full max-w-4xl mx-auto px-4 py-6 md:py-8 min-h-[100dvh]">',
               '<div className="ms-notifications-page w-full max-w-5xl mx-auto px-4 py-6 md:py-8 min-h-[100dvh]">'),
            ],
            'pages/ProfilePage.tsx': [
              ('<div className="max-w-5xl mx-auto space-y-8 pb-20 pt-4 md:pt-0">',
               '<div className="ms-profile-page max-w-5xl mx-auto space-y-8 pb-20 pt-4 md:pt-0">'),
            ],
            'pages/UsersPage.tsx': [
              ('<div className="space-y-8">\n\n      <div>\n        <div className="flex justify-between items-center mb-6">',
               '<div className="ms-users-page space-y-8">\n\n      <div>\n        <div className="flex justify-between items-center mb-6">'),
            ],
            'pages/BandPage.tsx': [
              ('<div className="space-y-6">\n      <div>\n        <p className="text-slate-500 dark:text-gray-400 max-w-3xl">',
               '<div className="ms-band-page space-y-6">\n      <div>\n        <p className="text-slate-500 dark:text-gray-400 max-w-3xl">'),
            ],
            'pages/BandScalesPage.tsx': [
              ('<div className="w-full max-w-5xl mx-auto py-8 lg:py-12 px-4 sm:px-6 lg:px-8 pb-32 space-y-8">',
               '<div className="ms-band-scales-page w-full max-w-5xl mx-auto py-8 lg:py-12 px-4 sm:px-6 lg:px-8 pb-32 space-y-8">'),
              ('<div className="max-w-3xl mx-auto py-16 lg:py-24 px-4 text-center">',
               '<div className="ms-band-scales-page max-w-3xl mx-auto py-16 lg:py-24 px-4 text-center">'),
            ],
          }

          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text()
            for before, after in pairs:
              count = text.count(before)
              if count != 1:
                raise SystemExit(f'{filename}: expected exactly one marker anchor, found {count}: {before[:72]}')
              text = text.replace(before, after, 1)
            path.write_text(text)

          Path('.github/workflows/premium-v2-operational-markers.yml').unlink()
          PY

      - name: Verify marker-only patch
        run: |
          git diff --check
          grep -F 'ms-notifications-page' pages/NotificationsPage.tsx
          grep -F 'ms-profile-page' pages/ProfilePage.tsx
          grep -F 'ms-users-page' pages/UsersPage.tsx
          grep -F 'ms-band-page' pages/BandPage.tsx
          grep -F 'ms-band-scales-page' pages/BandScalesPage.tsx
          git diff --stat

      - name: Commit markers and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/NotificationsPage.tsx pages/ProfilePage.tsx pages/UsersPage.tsx pages/BandPage.tsx pages/BandScalesPage.tsx .github/workflows/premium-v2-operational-markers.yml
          git commit -m "feat: scope Premium V2 operational surfaces"
          git push origin HEAD:feat/premium-v2-operational-surfaces-20260913
