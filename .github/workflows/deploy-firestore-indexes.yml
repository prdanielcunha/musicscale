name: Deploy Firestore Indexes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-indexes:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    environment: firebase-production
    concurrency:
      group: deploy-firestore-indexes
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MILLIONSNEST }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Indexes
        run: firebase deploy --only firestore:indexes --project millionsnest --non-interactive
