name: Firebase Web Infrastructure Preflight

on:
  pull_request:
    branches: [ main, production ]
  push:
    branches: [ production ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: musicscale-firebase-web-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Firebase migration contract
        run: npx tsx scripts/test_firebase_hosting_cloudrun_policy.ts

      - name: Build production artifacts
        run: npm run build

  google_cloud_read_only:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate with MillionsNest production WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com
          audience: //iam.googleapis.com/projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github

      - name: Read-only infrastructure discovery
        if: steps.auth.outcome == 'success'
        shell: bash
        run: |
          set -u
          echo "Active Google identity:"
          gcloud auth list --filter=status:ACTIVE --format='value(account)' || true
          echo "Enabled APIs relevant to the migration:"
          gcloud services list --enabled --project millionsnest --format='value(config.name)' 2>/dev/null \
            | grep -E '^(run|firebasehosting|artifactregistry|cloudbuild|secretmanager)\.googleapis\.com$' || true
          echo "Existing Cloud Run services in us-central1:"
          gcloud run services list --project millionsnest --region us-central1 --format='value(metadata.name)' 2>/dev/null || true
          echo "Firestore database locations:"
          gcloud firestore databases list --project millionsnest --format='table(name,locationId,type)' 2>/dev/null || true
          echo "Firebase Hosting sites:"
          npm install -g firebase-tools@15.26.0 >/dev/null 2>&1 || true
          firebase hosting:sites:list --project millionsnest 2>/dev/null || true
          echo "Relevant Secret Manager names (values are never read):"
          gcloud secrets list --project millionsnest --format='value(name)' 2>/dev/null \
            | grep -Ei 'musicscale|stripe|gemini|finops|millionsnest' || true
          echo "Read-only preflight finished. No cloud resource was changed."

      - name: Explain unavailable WIF without failing product QA
        if: steps.auth.outcome != 'success'
        run: |
          echo "MillionsNest production WIF authentication failed."
          echo "This is expected when the provider is production-ref restricted."
          echo "Product QA remains authoritative; production deployment stays blocked until IAM is verified."
