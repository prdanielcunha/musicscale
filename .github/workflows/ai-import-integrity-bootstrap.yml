name: Apply AI Import Integrity V2

on:
  push:
    branches: [ fix/ai-import-integrity-v2 ]
    paths:
      - '.github/workflows/ai-import-integrity-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-import-integrity-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply integrity patch
        run: node scripts/apply-ai-import-integrity-v2.mjs

      - name: Bump beta hotfix version
        run: npm version 0.2.0-beta.1 --no-git-tag-version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused importer regression tests
        run: npx vitest run tests/unit/chord-document-normalizer.test.ts tests/server/ai-import-document-integrity-contract.test.ts

      - name: Type check
        run: npx tsc --noEmit

      - name: Remove bootstrap files
        run: rm scripts/apply-ai-import-integrity-v2.mjs .github/workflows/ai-import-integrity-bootstrap.yml

      - name: Verify clean patch
        run: git diff --check

      - name: Commit final implementation
        run: |
          git config user.name "ChatGPT AI Import Worker"
          git config user.email "actions@users.noreply.github.com"
          git add server.ts utils/textNormalizer.ts tests/unit/chord-document-normalizer.test.ts tests/server/ai-import-document-integrity-contract.test.ts package.json package-lock.json scripts/apply-ai-import-integrity-v2.mjs .github/workflows/ai-import-integrity-bootstrap.yml
          git commit -m "fix(ai-import): make deterministic chart integrity authoritative"
          git push origin HEAD:fix/ai-import-integrity-v2
