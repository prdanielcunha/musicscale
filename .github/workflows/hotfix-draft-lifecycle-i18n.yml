name: Validate Draft Lifecycle i18n

on:
  push:
    branches:
      - chatgpt/hotfix-draft-lifecycle-20260912
    paths:
      - 'scripts/apply-draft-lifecycle-i18n.mjs'
      - '.github/workflows/hotfix-draft-lifecycle-i18n.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: ${{ !contains(github.event.head_commit.message, '[i18n-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/hotfix-draft-lifecycle-20260912
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply translations
        run: node scripts/apply-draft-lifecycle-i18n.mjs
      - name: Validate locale JSON
        run: node -e "for (const l of ['pt','en','es']) JSON.parse(require('fs').readFileSync('locales/'+l+'.json','utf8'))"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript gate
        run: npm run lint
      - name: Dashboard regression gate
        run: npm run test:scale-dashboard
      - name: MusicScale publish cycle gate
        run: npm run test:scale-cycle
      - name: Build gate
        run: npm run build
      - name: Commit validated translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locales/pt.json locales/en.json locales/es.json
          git commit -m "fix: localize draft lifecycle actions [i18n-applied]"
          git push origin HEAD:chatgpt/hotfix-draft-lifecycle-20260912
