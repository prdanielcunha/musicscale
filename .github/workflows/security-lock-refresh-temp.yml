name: Temporary WebSocket Driver Lock Refresh

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'chatgpt/security-websocket-driver-075'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh only websocket-driver lock entry
        shell: bash
        run: |
          npm update websocket-driver --package-lock-only --ignore-scripts
          node <<'NODE'
          const lock = require('./package-lock.json');
          const entry = lock.packages?.['node_modules/websocket-driver'];
          if (entry?.version !== '0.7.5') {
            throw new Error(`Expected websocket-driver 0.7.5, got ${entry?.version}`);
          }
          NODE

      - name: Verify production critical vulnerabilities are zero
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/audit-prod.json', 'utf8'));
          const critical = report.metadata?.vulnerabilities?.critical ?? -1;
          console.log('Production vulnerability summary:', report.metadata?.vulnerabilities);
          if (critical !== 0) {
            throw new Error(`Expected 0 critical vulnerabilities, got ${critical}`);
          }
          NODE

      - name: Ensure package manifest is unchanged
        shell: bash
        run: |
          git diff --exit-code -- package.json
          git diff -- package-lock.json

      - name: Remove temporary workflow and commit lock refresh
        shell: bash
        run: |
          rm .github/workflows/security-lock-refresh-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/security-lock-refresh-temp.yml
          git commit -m 'fix(security): refresh websocket-driver lock entry'
          git push origin HEAD:${{ github.head_ref }}
