name: Sync MusicScale Release Lock Once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sync-release-lock-once.yml'

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize package lock version
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lock if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: sync package lock for 0.3.4-beta.1'
          git push origin HEAD:main
