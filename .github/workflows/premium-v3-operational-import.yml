name: Wire Premium V3 Operational Continuity

on:
  push:
    branches:
      - feat/premium-v2-experience-20260913-final
    paths:
      - .github/workflows/premium-v3-operational-import.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-v2-experience-20260913-final
          fetch-depth: 0

      - name: Wire operational experience
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: anchor mismatch')
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              'index.tsx',
              "import './experience-v3-command.css';",
              "import './experience-v3-command.css';\nimport './experience-v3-operational.css';",
              'operational css import'
          )
          replace_exact(
              'components/layout/Sidebar.tsx',
              'className="h-full flex flex-col bg-[#0a0a0c]/[0.985] md:bg-[#0a0a0c]/80 md:backdrop-blur-[32px] md:saturate-[180%] border border-white/[0.06] shadow-[0_8px_32px_rgba(0,0,0,0.4)] pt-2 md:pt-4 relative overflow-hidden rounded-[20px] transform-gpu"',
              'className="ms-v3-sidebar h-full flex flex-col bg-[#0a0a0c]/[0.985] md:bg-[#0a0a0c]/80 md:backdrop-blur-[32px] md:saturate-[180%] border border-white/[0.06] shadow-[0_8px_32px_rgba(0,0,0,0.4)] pt-2 md:pt-4 relative overflow-hidden rounded-[20px] transform-gpu"',
              'sidebar root marker'
          )

          Path('.github/workflows/premium-v3-operational-import.yml').unlink()
          PY

      - name: Commit operational continuity
        run: |
          git config user.name "prdanielcunha"
          git config user.email "pastordanielpcunha@gmail.com"
          git add index.tsx components/layout/Sidebar.tsx .github/workflows/premium-v3-operational-import.yml
          git commit -m "feat: extend Premium V2 across operational workspaces"
          git push origin HEAD:feat/premium-v2-experience-20260913-final
