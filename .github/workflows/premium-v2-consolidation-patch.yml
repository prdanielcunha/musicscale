name: Premium V2 Consolidation Patch

on:
  push:
    branches:
      - feat/premium-v2-performance-stage-20260913
    paths:
      - .github/workflows/premium-v2-consolidation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-v2-performance-stage-20260913
          fetch-depth: 0

      - name: Apply scoped source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          scales = Path('pages/ScalesPage.tsx')
          text = scales.read_text()
          before = '''        if (scaleId && populatedScales.length > 0 && !hasHandledDeepLink.current) {\n            const scale = populatedScales.find(s => s.id === scaleId);'''
          after = '''        if (scaleId && populatedScales.length > 0 && !hasHandledDeepLink.current) {\n            const expectedPath = `/scales/${scaleId}`;\n            if (location.pathname !== expectedPath) {\n                return;\n            }\n\n            const scale = populatedScales.find(s => s.id === scaleId);'''
          if before not in text:
              raise SystemExit('Scales deep-link source contract not found')
          text = text.replace(before, after, 1)

          deps_before = '    }, [scaleId, populatedScales, openScaleDetail, navigate]);'
          deps_after = '    }, [scaleId, populatedScales, openScaleDetail, navigate, location.pathname]);'
          if deps_before not in text:
              raise SystemExit('Scales deep-link dependency contract not found')
          text = text.replace(deps_before, deps_after, 1)
          scales.write_text(text)

          chords = Path('pages/ChordsPage.tsx')
          chord_text = chords.read_text()
          label = ' aria-label="Filtros de cifras"'
          if label not in chord_text:
              raise SystemExit('Chords PT-only aria-label contract not found')
          chords.write_text(chord_text.replace(label, '', 1))

          workflow = Path('.github/workflows/premium-v2-consolidation-patch.yml')
          workflow.unlink()
          PY

      - name: Verify patch is minimal
        run: |
          git diff --check
          git diff -- pages/ScalesPage.tsx pages/ChordsPage.tsx

      - name: Commit consolidation patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/ScalesPage.tsx pages/ChordsPage.tsx .github/workflows/premium-v2-consolidation-patch.yml
          git commit -m "fix: consolidate Premium V2 navigation and i18n guard"
          git push origin HEAD:feat/premium-v2-performance-stage-20260913
