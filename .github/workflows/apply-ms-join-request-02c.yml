name: Apply MusicScale Join Request 02C

on:
  push:
    branches:
      - "codex/ms-sec-p0-join-request-hub-adapter-02c"
    paths:
      - ".github/workflows/apply-ms-join-request-02c.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply guarded patch
        run: python3 scripts/apply_ms_join_request_02c.py
      - name: Verify patch scope
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git diff -- server.ts pages/TenantOnboarding.tsx pages/UsersPage.tsx firestore.rules
      - name: Commit functional migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts pages/TenantOnboarding.tsx pages/UsersPage.tsx firestore.rules
          git diff --cached --check
          git commit -m "fix(security): delegate join requests to MillionsNest Hub"
          git push origin HEAD:codex/ms-sec-p0-join-request-hub-adapter-02c
