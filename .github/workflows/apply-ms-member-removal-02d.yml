name: Apply MusicScale Member Removal 02D

on:
  push:
    branches:
      - "codex/ms-sec-p0-member-removal-hub-adapter-02d"
    paths:
      - ".github/workflows/apply-ms-member-removal-02d.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply guarded migration
        run: python3 scripts/apply_ms_member_removal_02d.py
      - name: Verify scope
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' pages/UsersPage.tsx server.ts | sort)"
          git diff -- server.ts pages/UsersPage.tsx
      - name: Commit functional migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts pages/UsersPage.tsx
          git diff --cached --check
          git commit -m "fix(security): delegate member removal to MillionsNest Hub"
          git push origin HEAD:codex/ms-sec-p0-member-removal-hub-adapter-02d
