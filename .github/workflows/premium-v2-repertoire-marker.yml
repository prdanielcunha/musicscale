name: Premium V2 Repertoire Surface Marker

on:
  push:
    branches:
      - feat/premium-v2-operational-surfaces-20260913
    paths:
      - .github/workflows/premium-v2-repertoire-marker.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-v2-operational-surfaces-20260913
          fetch-depth: 0

      - name: Add repertoire visual scope markers only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pages/SongsPage.tsx')
          text = path.read_text()
          replacements = [
            ('<div className="max-w-4xl mx-auto py-12 md:py-20 px-4 text-center">',
             '<div className="ms-songs-page max-w-4xl mx-auto py-12 md:py-20 px-4 text-center">'),
            ('<div className="space-y-6">\n      {canManageRepertoire && (!allowance?.completed || allowanceLoading || allowanceError) && (',
             '<div className="ms-songs-page space-y-6">\n      {canManageRepertoire && (!allowance?.completed || allowanceLoading || allowanceError) && ('),
          ]
          for before, after in replacements:
            count = text.count(before)
            if count != 1:
              raise SystemExit(f'Expected exactly one repertoire marker anchor, found {count}: {before[:80]}')
            text = text.replace(before, after, 1)
          path.write_text(text)
          Path('.github/workflows/premium-v2-repertoire-marker.yml').unlink()
          PY

      - name: Verify marker-only patch
        run: |
          git diff --check
          test "$(grep -o 'ms-songs-page' pages/SongsPage.tsx | wc -l)" -eq 2
          git diff -- pages/SongsPage.tsx

      - name: Commit marker and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/SongsPage.tsx .github/workflows/premium-v2-repertoire-marker.yml
          git commit -m "feat: scope Premium V2 repertoire workspace"
          git push origin HEAD:feat/premium-v2-operational-surfaces-20260913
