name: Premium V2 Content Skeletons

on:
  push:
    branches:
      - feat/premium-v2-operational-surfaces-20260913
    paths:
      - .github/workflows/premium-v2-content-skeletons.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-v2-operational-surfaces-20260913
          fetch-depth: 0

      - name: Replace generic page spinners with content-shaped skeletons
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
            'pages/SongsPage.tsx': {
              'imports': [
                ('import Spinner from "../components/common/Spinner";\n', 'import Spinner from "../components/common/Spinner";\nimport MusicWorkspaceSkeleton from "../components/common/MusicWorkspaceSkeleton";\n'),
              ],
              'blocks': [
                ('''  if (loading)\n    return (\n      <div className="flex justify-center items-center h-full">\n        <Spinner />\n      </div>\n    );''',
                 '''  if (loading)\n    return <MusicWorkspaceSkeleton cardCount={8} />;'''),
              ],
            },
            'pages/ProfilePage.tsx': {
              'imports': [
                ('import Spinner from "../components/common/Spinner";\n', 'import Spinner from "../components/common/Spinner";\nimport OperationalWorkspaceSkeleton from "../components/common/OperationalWorkspaceSkeleton";\n'),
              ],
              'blocks': [
                ('''  if (isInitialLoading) {\n    return (\n      <div className="flex justify-center items-center h-full">\n        <Spinner />\n      </div>\n    );\n  }''',
                 '''  if (isInitialLoading) {\n    return <OperationalWorkspaceSkeleton variant="profile" />;\n  }'''),
              ],
            },
            'pages/UsersPage.tsx': {
              'imports': [
                ('import Spinner from "../components/common/Spinner";\n', 'import Spinner from "../components/common/Spinner";\nimport OperationalWorkspaceSkeleton from "../components/common/OperationalWorkspaceSkeleton";\n'),
              ],
              'blocks': [
                ('''  if (loading) {\n    return (\n      <div className="flex justify-center items-center h-full">\n        <Spinner size="lg" />\n      </div>\n    );\n  }''',
                 '''  if (loading) {\n    return <OperationalWorkspaceSkeleton variant="team" />;\n  }'''),
              ],
            },
            'pages/BandPage.tsx': {
              'imports': [
                ('import Spinner from "../components/common/Spinner";\n', 'import Spinner from "../components/common/Spinner";\nimport OperationalWorkspaceSkeleton from "../components/common/OperationalWorkspaceSkeleton";\n'),
              ],
              'blocks': [
                ('''  if (loading)\n    return (\n      <div className="flex justify-center items-center h-full">\n        <Spinner size="lg" />\n      </div>\n    );''',
                 '''  if (loading)\n    return <OperationalWorkspaceSkeleton variant="directory" />;'''),
              ],
            },
            'pages/BandScalesPage.tsx': {
              'imports': [
                ('import Spinner from "../components/common/Spinner";\n', 'import Spinner from "../components/common/Spinner";\nimport OperationalWorkspaceSkeleton from "../components/common/OperationalWorkspaceSkeleton";\n'),
              ],
              'blocks': [
                ('''  if (loading)\n    return (\n      <div className="flex justify-center items-center h-full">\n        <Spinner />\n      </div>\n    );''',
                 '''  if (loading)\n    return <OperationalWorkspaceSkeleton variant="scales" />;'''),
              ],
            },
          }

          for filename, spec in files.items():
            path = Path(filename)
            text = path.read_text()
            for before, after in spec['imports'] + spec['blocks']:
              count = text.count(before)
              if count != 1:
                raise SystemExit(f'{filename}: expected one skeleton anchor, found {count}: {before[:90]}')
              text = text.replace(before, after, 1)
            path.write_text(text)

          Path('.github/workflows/premium-v2-content-skeletons.yml').unlink()
          PY

      - name: Verify scoped loading-state diff
        run: |
          git diff --check
          grep -F 'MusicWorkspaceSkeleton cardCount={8}' pages/SongsPage.tsx
          grep -F 'OperationalWorkspaceSkeleton variant="profile"' pages/ProfilePage.tsx
          grep -F 'OperationalWorkspaceSkeleton variant="team"' pages/UsersPage.tsx
          grep -F 'OperationalWorkspaceSkeleton variant="directory"' pages/BandPage.tsx
          grep -F 'OperationalWorkspaceSkeleton variant="scales"' pages/BandScalesPage.tsx
          git diff --stat

      - name: Commit skeletons and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/SongsPage.tsx pages/ProfilePage.tsx pages/UsersPage.tsx pages/BandPage.tsx pages/BandScalesPage.tsx .github/workflows/premium-v2-content-skeletons.yml
          git commit -m "feat: use content-shaped Premium V2 loading states"
          git push origin HEAD:feat/premium-v2-operational-surfaces-20260913
