name: MusicScale protected source recovery
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: musicscale-source-recovery-production
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com
      - name: Recover through dedicated IAM-authenticated Cloud Run job
        run: bash scripts/run-connect-source-recovery.sh
