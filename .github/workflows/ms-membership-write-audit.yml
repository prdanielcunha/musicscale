name: MusicScale Membership Write Audit

on:
  push:
    branches:
      - "certify/ms-membership-write-audit"
    paths:
      - ".github/workflows/ms-membership-write-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "66bfbc3d62c6d27b55139c1232f10866e94bb04e"
          persist-credentials: false
          fetch-depth: 1
      - name: Direct membership authority references
        run: |
          set +e
          echo '=== organization_members references ==='
          grep -RInE --include='*.ts' --include='*.tsx' --include='*.js' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git 'organization_members' . || true
          echo '=== canonical members references ==='
          grep -RInE --include='*.ts' --include='*.tsx' --include='*.js' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git "organizations.{0,120}members|collection\([^)]*['\"]members['\"]|doc\([^)]*['\"]members['\"]" . || true
          echo '=== organizationRole writes/migrations ==='
          grep -RInE --include='*.ts' --include='*.tsx' --include='*.js' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git 'organizationRole[[:space:]]*=|organizationRole[[:space:]]*:|role\.updated|handleMigrateRoles' . || true
