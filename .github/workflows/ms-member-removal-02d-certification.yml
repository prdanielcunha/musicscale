name: MusicScale Member Removal 02D Certification

on:
  push:
    branches:
      - "certify/ms-member-removal-02d"
    paths:
      - ".github/workflows/ms-member-removal-02d-certification.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "4eb215aad7753e0085642aa3535412f53375090c"
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact feature head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4eb215aad7753e0085642aa3535412f53375090c"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: 02D member removal adapter and compatibility
        run: npx vitest run tests/server/hub-member-removal-adapter-02d.test.ts tests/server/music-scale-member-removal-compatibility-02d.test.ts tests/server/music-scale-member-removal-migration-02d.test.ts
      - name: 02C join request regression
        run: npx vitest run tests/server/hub-join-request-adapter-02c.test.ts tests/server/music-scale-join-request-compatibility-02c.test.ts tests/server/music-scale-join-request-migration-02c.test.ts
      - name: 02A and 02B regressions
        run: npx vitest run tests/server/music-scale-member-projection.test.ts tests/server/hub-invitation-adapter-02b.test.ts tests/server/music-scale-invitation-compatibility-02b2.test.ts
      - name: Existing security Rules real Emulator
        run: npx firebase emulators:exec --project demo-musicscale-rules --only firestore "npx vitest run tests/server/music-scale-security-rules.test.ts"
      - name: AI authorization regression
        run: npx tsx scripts/test_phase0_2c1a_ai_authorization.ts
      - name: Lint typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Hygiene
        run: |
          set -euo pipefail
          git diff --check
          test "$(git rev-parse HEAD)" = "4eb215aad7753e0085642aa3535412f53375090c"
          test -z "$(git status --porcelain)"
