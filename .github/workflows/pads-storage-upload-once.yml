name: One-time MusicScale Warm Pads Storage Dispatch
# Temporary coordinator: remove after the official Warm library is verified.

on:
  push:
    branches: [ production ]
    paths:
      - .github/workflows/pads-storage-upload-once.yml
      - .github/workflows/deploy-firebase-functions.yml
      - .github/workflows/deploy-firestore-rules.yml
      - .github/workflows/deploy-firestore-indexes.yml
      - scripts/publish-warm-pads-gcloud.sh

permissions:
  contents: read
  actions: write

concurrency:
  group: musicscale-pads-storage-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch dedicated production WIF publishers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          workflows=(
            deploy-firebase-functions.yml
            deploy-firestore-rules.yml
            deploy-firestore-indexes.yml
          )

          for workflow in "${workflows[@]}"; do
            echo "Dispatching $workflow on production..."
            status="$(curl --silent --show-error --location \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o /tmp/dispatch-response.json \
              -w '%{http_code}' \
              "https://api.github.com/repos/$REPO/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"production","inputs":{"smoke_only":true,"publish_warm_pads":true}}')"

            if [[ "$status" != "204" ]]; then
              echo "Failed to dispatch $workflow (HTTP $status)"
              cat /tmp/dispatch-response.json || true
              exit 1
            fi
          done

          {
            echo '## MusicScale Warm pad publisher dispatch'
            echo
            echo 'Dispatched the Functions, Rules, and Indexes production WIF publishers.'
            echo 'Each dedicated workflow probes Storage access; only a candidate with verified create/read access proceeds to the 12 canonical pads.'
          } >> "$GITHUB_STEP_SUMMARY"
