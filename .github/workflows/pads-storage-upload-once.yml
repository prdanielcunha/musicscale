name: One-time MusicScale Warm Pads Storage Upload
# Temporary workflow: remove after verified upload

on:
  push:
    branches: [ production ]
    paths:
      - .github/workflows/pads-storage-upload-once.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: musicscale-pads-storage-upload-once
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      BUCKET: millionsnest.firebasestorage.app
      PREFIX: musicscale/pads/official/warm-v1
    steps:
      - name: Authenticate Drive source
        id: drive_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive.readonly

      - name: Download and verify the 12 official source pads
        shell: bash
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.drive_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/musicscale-pads
          cd /tmp/musicscale-pads

          IDS=(
            1xCokteWYu9mfl7cSY_Opr6k2MykMYCHS
            1lFc7qDQqUtc3AeZp2FdIgt9OafXHGQO9
            1WG8KGU4KhH3rGpxRpztLLDRnNtOSdfKH
            1GQjlv_Y2Xfk8FrbqGiMn6t7t6HlqLHCp
            1PN9S6TCjw078CD2o8WaXuv_p0QR5k72Q
            1KDBlcGCQmyx2C7cyM9XWKg0YDJQdzu37
            1W4WloNlNVvbH0iE4qNebGGW2V5vkvzgT
            1K94GPpk76YieTt8BKQcAvxOOblAEfXTp
            1j8L-F9d7cJl7Tch0FI-5znWvqfbONWcl
            1vtc8JmjyFZL3KM_NDUVUxxVrr5NItF5P
            1IoTp6iMjjmTvJYH2-0DXmZxC3mOv7GEc
            1vRnGcZXXM1BdFTZtcGopWcgIfgFrGZZk
          )
          FILES=(
            'Pad_C_Warm.mp3'
            'Pad_C#_Warm.mp3'
            'Pad_D_Warm.mp3'
            'Pad_D#_Warm.mp3'
            'Pad_E_Warm.mp3'
            'Pad_F_Warm.mp3'
            'Pad_F#_Warm.mp3'
            'Pad_G_Warm.mp3'
            'Pad_G#_Warm.mp3'
            'Pad_A_Warm.mp3'
            'Pad_A#_Warm.mp3'
            'Pad_B_Warm.mp3'
          )
          SHAS=(
            0312b26b467cbfbcbd7bc5e8ebcf9a90f4e977b10688839e2a2a8ef4a224173c
            f8f1b19873635a9a84a126d5ccb16841b0c97e17e784e18313d32e26ce2a8dfd
            3f87621e4f70a05e40c5e56eb6b9d93fcd8ea6ce8ec1081ec58f883c9bf49673
            1aec1c3dc0efc5a3c09851cac6495b753aba63080035a97daa43246791eee403
            3ed6187d8e6f5fc0b8ca1f094d4afc4fc691ec03746ab7c0febecea8d5a5e1fe
            b7b0ac5e6ee41f108113cdc0d424a0e1dff2919a7e5a79297fa2b0be0d1d01e0
            97ef632ae1028b8a526cbe9f0cf80ff06325a597765d2745771239181c0b1278
            6edbb967f9d7b949f43fe6a8bc62639833a27833e1cb64a5cb44ed9b5d6c741b
            285a3a31e9c5cfa55598add7cfc460645722a3f16853d882ae88325e2c46cd3c
            ebffdefb14fe5be840efc2237a96681cb79ba595de519531c00d8b0cda368255
            8686296cdb38c7a139d60a3989779e80eb37bb6db282ab559cea60cd83ca5d97
            bb64f1199fde3b9bcf224552fa0ba0938ce4be0c297e8eef7d2e05e650ef2de8
          )

          for i in "${!FILES[@]}"; do
            file="${FILES[$i]}"
            id="${IDS[$i]}"
            expected="${SHAS[$i]}"
            url="https://www.googleapis.com/drive/v3/files/$id?alt=media&supportsAllDrives=true"
            curl --fail --silent --show-error --location \
              --retry 4 --retry-delay 3 --retry-all-errors \
              -H "Authorization: Bearer $DRIVE_ACCESS_TOKEN" \
              "$url" -o "$file"
            actual="$(sha256sum "$file" | cut -d' ' -f1)"
            test "$actual" = "$expected"
            echo "Source verified: $file"
          done

      - name: Authenticate Storage candidate - Functions deployer
        id: auth_fn
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/ms-fn-prod-v1/providers/github
          service_account: ms-fn-prod-wif-v1@millionsnest.iam.gserviceaccount.com
          audience: //iam.googleapis.com/projects/555464791734/locations/global/workloadIdentityPools/ms-fn-prod-v1/providers/github
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Probe Functions deployer Storage access
        id: probe_fn
        if: steps.auth_fn.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ steps.auth_fn.outputs.access_token }}
        run: |
          set -euo pipefail
          printf 'musicscale-storage-probe' >/tmp/storage-probe
          object="$PREFIX/_probe-functions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$object")"
          code="$(curl --silent --show-error --location -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: text/plain" --data-binary @/tmp/storage-probe -o /tmp/probe-fn.json -w '%{http_code}' "https://storage.googleapis.com/upload/storage/v1/b/$BUCKET/o?uploadType=media&name=$encoded")"
          test "$code" = 200 || { cat /tmp/probe-fn.json; exit 1; }
          curl --fail --silent --show-error --location -H "Authorization: Bearer $TOKEN" "https://storage.googleapis.com/storage/v1/b/$BUCKET/o/$encoded?alt=media" -o /tmp/storage-probe-read
          cmp /tmp/storage-probe /tmp/storage-probe-read
          curl --silent --show-error --location -X DELETE -H "Authorization: Bearer $TOKEN" "https://storage.googleapis.com/storage/v1/b/$BUCKET/o/$encoded" >/dev/null || true
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate Storage candidate - MusicScale runtime
        id: auth_runtime
        if: steps.probe_fn.outcome != 'success'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-musicscale-runtime@millionsnest.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Probe runtime Storage access
        id: probe_runtime
        if: steps.auth_runtime.outcome == 'success' && steps.probe_fn.outcome != 'success'
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ steps.auth_runtime.outputs.access_token }}
        run: |
          set -euo pipefail
          printf 'musicscale-storage-probe' >/tmp/storage-probe
          object="$PREFIX/_probe-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$object")"
          code="$(curl --silent --show-error --location -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: text/plain" --data-binary @/tmp/storage-probe -o /tmp/probe-runtime.json -w '%{http_code}' "https://storage.googleapis.com/upload/storage/v1/b/$BUCKET/o?uploadType=media&name=$encoded")"
          test "$code" = 200 || { cat /tmp/probe-runtime.json; exit 1; }
          curl --fail --silent --show-error --location -H "Authorization: Bearer $TOKEN" "https://storage.googleapis.com/storage/v1/b/$BUCKET/o/$encoded?alt=media" -o /tmp/storage-probe-read
          cmp /tmp/storage-probe /tmp/storage-probe-read
          curl --silent --show-error --location -X DELETE -H "Authorization: Bearer $TOKEN" "https://storage.googleapis.com/storage/v1/b/$BUCKET/o/$encoded" >/dev/null || true
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate Storage candidate - Rules deployer
        id: auth_rules
        if: steps.probe_fn.outcome != 'success' && steps.probe_runtime.outcome != 'success'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/ms-rules-prod-v1/providers/github
          service_account: ms-rules-prod-wif-v1@millionsnest.iam.gserviceaccount.com
          audience: //iam.googleapis.com/projects/555464791734/locations/global/workloadIdentityPools/ms-rules-prod-v1/providers/github
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Probe Rules deployer Storage access
        id: probe_rules
        if: steps.auth_rules.outcome == 'success' && steps.probe_fn.outcome != 'success' && steps.probe_runtime.outcome != 'success'
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ steps.auth_rules.outputs.access_token }}
        run: |
          set -euo pipefail
          printf 'musicscale-storage-probe' >/tmp/storage-probe
          object="$PREFIX/_probe-rules-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$object")"
          code="$(curl --silent --show-error --location -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: text/plain" --data-binary @/tmp/storage-probe -o /tmp/probe-rules.json -w '%{http_code}' "https://storage.googleapis.com/upload/storage/v1/b/$BUCKET/o?uploadType=media&name=$encoded")"
          test "$code" = 200 || { cat /tmp/probe-rules.json; exit 1; }
          curl --fail --silent --show-error --location -H "Authorization: Bearer $TOKEN" "https://storage.googleapis.com/storage/v1/b/$BUCKET/o/$encoded?alt=media" -o /tmp/storage-probe-read
          cmp /tmp/storage-probe /tmp/storage-probe-read
          curl --silent --show-error --location -X DELETE -H "Authorization: Bearer $TOKEN" "https://storage.googleapis.com/storage/v1/b/$BUCKET/o/$encoded" >/dev/null || true
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate Storage candidate - Indexes deployer
        id: auth_indexes
        if: steps.probe_fn.outcome != 'success' && steps.probe_runtime.outcome != 'success' && steps.probe_rules.outcome != 'success'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/ms-indexes-prod-v1/providers/github
          service_account: ms-indexes-prod-wif-v1@millionsnest.iam.gserviceaccount.com
          audience: //iam.googleapis.com/projects/555464791734/locations/global/workloadIdentityPools/ms-indexes-prod-v1/providers/github
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Probe Indexes deployer Storage access
        id: probe_indexes
        if: steps.auth_indexes.outcome == 'success' && steps.probe_fn.outcome != 'success' && steps.probe_runtime.outcome != 'success' && steps.probe_rules.outcome != 'success'
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ steps.auth_indexes.outputs.access_token }}
        run: |
          set -euo pipefail
          printf 'musicscale-storage-probe' >/tmp/storage-probe
          object="$PREFIX/_probe-indexes-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$object")"
          code="$(curl --silent --show-error --location -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: text/plain" --data-binary @/tmp/storage-probe -o /tmp/probe-indexes.json -w '%{http_code}' "https://storage.googleapis.com/upload/storage/v1/b/$BUCKET/o?uploadType=media&name=$encoded")"
          test "$code" = 200 || { cat /tmp/probe-indexes.json; exit 1; }
          curl --fail --silent --show-error --location -H "Authorization: Bearer $TOKEN" "https://storage.googleapis.com/storage/v1/b/$BUCKET/o/$encoded?alt=media" -o /tmp/storage-probe-read
          cmp /tmp/storage-probe /tmp/storage-probe-read
          curl --silent --show-error --location -X DELETE -H "Authorization: Bearer $TOKEN" "https://storage.googleapis.com/storage/v1/b/$BUCKET/o/$encoded" >/dev/null || true
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Select working Storage identity
        shell: bash
        env:
          FN_TOKEN: ${{ steps.auth_fn.outputs.access_token }}
          RUNTIME_TOKEN: ${{ steps.auth_runtime.outputs.access_token }}
          RULES_TOKEN: ${{ steps.auth_rules.outputs.access_token }}
          INDEXES_TOKEN: ${{ steps.auth_indexes.outputs.access_token }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.probe_fn.outcome }}" == "success" ]]; then
            token="$FN_TOKEN"
            identity='ms-fn-prod-wif-v1@millionsnest.iam.gserviceaccount.com'
          elif [[ "${{ steps.probe_runtime.outcome }}" == "success" ]]; then
            token="$RUNTIME_TOKEN"
            identity='mn-musicscale-runtime@millionsnest.iam.gserviceaccount.com'
          elif [[ "${{ steps.probe_rules.outcome }}" == "success" ]]; then
            token="$RULES_TOKEN"
            identity='ms-rules-prod-wif-v1@millionsnest.iam.gserviceaccount.com'
          elif [[ "${{ steps.probe_indexes.outcome }}" == "success" ]]; then
            token="$INDEXES_TOKEN"
            identity='ms-indexes-prod-wif-v1@millionsnest.iam.gserviceaccount.com'
          else
            echo 'No existing production identity has both storage.objects.create and storage.objects.get for the Warm pad prefix.'
            exit 1
          fi
          echo "::add-mask::$token"
          echo "STORAGE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "STORAGE_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Upload and read back the 12 official pads
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/musicscale-pads
          FILES=(
            'Pad_C_Warm.mp3' 'Pad_C#_Warm.mp3' 'Pad_D_Warm.mp3' 'Pad_D#_Warm.mp3'
            'Pad_E_Warm.mp3' 'Pad_F_Warm.mp3' 'Pad_F#_Warm.mp3' 'Pad_G_Warm.mp3'
            'Pad_G#_Warm.mp3' 'Pad_A_Warm.mp3' 'Pad_A#_Warm.mp3' 'Pad_B_Warm.mp3'
          )
          SHAS=(
            0312b26b467cbfbcbd7bc5e8ebcf9a90f4e977b10688839e2a2a8ef4a224173c
            f8f1b19873635a9a84a126d5ccb16841b0c97e17e784e18313d32e26ce2a8dfd
            3f87621e4f70a05e40c5e56eb6b9d93fcd8ea6ce8ec1081ec58f883c9bf49673
            1aec1c3dc0efc5a3c09851cac6495b753aba63080035a97daa43246791eee403
            3ed6187d8e6f5fc0b8ca1f094d4afc4fc691ec03746ab7c0febecea8d5a5e1fe
            b7b0ac5e6ee41f108113cdc0d424a0e1dff2919a7e5a79297fa2b0be0d1d01e0
            97ef632ae1028b8a526cbe9f0cf80ff06325a597765d2745771239181c0b1278
            6edbb967f9d7b949f43fe6a8bc62639833a27833e1cb64a5cb44ed9b5d6c741b
            285a3a31e9c5cfa55598add7cfc460645722a3f16853d882ae88325e2c46cd3c
            ebffdefb14fe5be840efc2237a96681cb79ba595de519531c00d8b0cda368255
            8686296cdb38c7a139d60a3989779e80eb37bb6db282ab559cea60cd83ca5d97
            bb64f1199fde3b9bcf224552fa0ba0938ce4be0c297e8eef7d2e05e650ef2de8
          )
          for i in "${!FILES[@]}"; do
            file="${FILES[$i]}"
            expected="${SHAS[$i]}"
            object="$PREFIX/$file"
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$object")"
            code="$(curl --silent --show-error --location --retry 4 --retry-delay 2 --retry-all-errors -X POST -H "Authorization: Bearer $STORAGE_ACCESS_TOKEN" -H "Content-Type: audio/mpeg" --data-binary "@$file" -o /tmp/upload-result.json -w '%{http_code}' "https://storage.googleapis.com/upload/storage/v1/b/$BUCKET/o?uploadType=media&name=$encoded")"
            test "$code" = 200 || { echo "Upload HTTP $code for $object"; cat /tmp/upload-result.json; exit 1; }
            remote_sha="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --retry-all-errors -H "Authorization: Bearer $STORAGE_ACCESS_TOKEN" "https://storage.googleapis.com/storage/v1/b/$BUCKET/o/$encoded?alt=media" | sha256sum | cut -d' ' -f1)"
            test "$remote_sha" = "$expected"
            echo "Verified $object"
          done

      - name: Publish upload evidence
        shell: bash
        run: |
          {
            echo '## MusicScale official Warm pads'
            echo
            echo "**Storage identity:** $STORAGE_IDENTITY"
            echo '**Bucket:** millionsnest.firebasestorage.app'
            echo '**Prefix:** musicscale/pads/official/warm-v1/'
            echo '**Verified files:** 12/12'
            echo
            echo 'Every source file and every uploaded object matched its expected SHA-256.'
          } >> "$GITHUB_STEP_SUMMARY"
