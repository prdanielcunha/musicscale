name: Refresh Firebase Lockfile

on:
  push:
    branches:
      - fix/qa-baseline-cleanup-20260813

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate Firebase 12.13.0 lockfile
        run: npm install firebase@12.13.0 --save-exact --package-lock-only --ignore-scripts

      - name: Upload generated dependency files
        uses: actions/upload-artifact@v4
        with:
          name: firebase-12-13-lockfiles
          path: |
            package.json
            package-lock.json
          retention-days: 1
