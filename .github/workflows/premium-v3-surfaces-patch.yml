name: Apply Premium V3 Surface Markers

on:
  push:
    branches:
      - feat/premium-v2-experience-20260913-final
    paths:
      - .github/workflows/premium-v3-surfaces-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-v2-experience-20260913-final
          fetch-depth: 0

      - name: Apply scoped V3 page markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              'pages/ScalesPage.tsx',
              '<div className="w-full max-w-5xl mx-auto py-8 lg:py-12 px-4 sm:px-6 lg:px-8 pb-32">',
              '<div className="ms-v3-scales-page w-full max-w-5xl mx-auto py-8 lg:py-12 px-4 sm:px-6 lg:px-8 pb-32">',
              'scales page root'
          )
          replace_exact(
              'pages/ScalesPage.tsx',
              'className={`group relative outline-none transition-all duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] border rounded-[24px] sm:rounded-[32px] cursor-pointer block overflow-hidden min-h-[120px] ${',
              'className={`ms-v3-scale-card group relative outline-none transition-all duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] border rounded-[24px] sm:rounded-[32px] cursor-pointer block overflow-hidden min-h-[120px] ${',
              'scale card marker'
          )
          replace_exact(
              'pages/LibraryPage.tsx',
              '<div className="min-h-screen w-full max-w-full overflow-x-hidden bg-slate-50 dark:bg-[#070709] pb-24 md:pb-0">',
              '<div className="ms-v3-library-page min-h-screen w-full max-w-full overflow-x-hidden bg-slate-50 dark:bg-[#070709] pb-24 md:pb-0">',
              'library page root'
          )
          replace_exact(
              'pages/ChordsPage.tsx',
              '<div className="space-y-5 sm:space-y-6">',
              '<div className="ms-v3-music-workspace ms-v3-chords-page space-y-5 sm:space-y-6">',
              'chords page root'
          )
          replace_exact(
              'pages/LyricsPage.tsx',
              '<div className="space-y-5 sm:space-y-6">',
              '<div className="ms-v3-music-workspace ms-v3-lyrics-page space-y-5 sm:space-y-6">',
              'lyrics page root'
          )
          replace_exact(
              'index.tsx',
              "import './experience-v3.css';",
              "import './experience-v3.css';\nimport './experience-v3-surfaces.css';",
              'surface css import'
          )

          Path('.github/workflows/premium-v3-surfaces-patch.yml').unlink()
          PY

      - name: Commit V3 surface markers
        run: |
          git config user.name "prdanielcunha"
          git config user.email "pastordanielpcunha@gmail.com"
          git add index.tsx pages/ScalesPage.tsx pages/LibraryPage.tsx pages/ChordsPage.tsx pages/LyricsPage.tsx .github/workflows/premium-v3-surfaces-patch.yml
          git commit -m "feat: extend MusicScale V3 across musical workspaces"
          git push origin HEAD:feat/premium-v2-experience-20260913-final
