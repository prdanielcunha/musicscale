name: Apply Premium V3 Surface Markers

on:
  push:
    branches: [ feat/premium-v2-experience-20260913-final ]
    paths:
      - .github/workflows/premium-v3-surfaces-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-v2-experience-20260913-final
          fetch-depth: 0

      - name: Apply page markers and experience CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              'pages/ScalesPage.tsx',
              '<div className="w-full max-w-5xl mx-auto py-8 lg:py-12 px-4 sm:px-6 lg:px-8 pb-32">',
              '<div className="ms-v3-scales-page w-full max-w-5xl mx-auto py-8 lg:py-12 px-4 sm:px-6 lg:px-8 pb-32">',
              'scales page root'
          )

          replace_exact(
              'pages/ScalesPage.tsx',
              'className={`group relative outline-none transition-all duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] border rounded-[24px] sm:rounded-[32px] cursor-pointer block overflow-hidden min-h-[120px] ${',
              'className={`ms-v3-scale-card group relative outline-none transition-all duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] border rounded-[24px] sm:rounded-[32px] cursor-pointer block overflow-hidden min-h-[120px] ${',
              'scale card marker'
          )

          replace_exact(
              'pages/LibraryPage.tsx',
              '<div className="min-h-screen w-full max-w-full overflow-x-hidden bg-slate-50 dark:bg-[#070709] pb-24 md:pb-0">',
              '<div className="ms-v3-library-page min-h-screen w-full max-w-full overflow-x-hidden bg-slate-50 dark:bg-[#070709] pb-24 md:pb-0">',
              'library page root'
          )

          replace_exact(
              'pages/ChordsPage.tsx',
              '<div className="space-y-5 sm:space-y-6">',
              '<div className="ms-v3-music-workspace ms-v3-chords-page space-y-5 sm:space-y-6">',
              'chords page root'
          )

          replace_exact(
              'pages/LyricsPage.tsx',
              '<div className="space-y-5 sm:space-y-6">',
              '<div className="ms-v3-music-workspace ms-v3-lyrics-page space-y-5 sm:space-y-6">',
              'lyrics page root'
          )

          css = Path('experience-v3.css')
          text = css.read_text()
          marker = '/* V3 FULL-SURFACE EXTENSIONS */'
          if marker in text:
              raise SystemExit('experience extensions already applied')

          text += r'''

/* V3 FULL-SURFACE EXTENSIONS */
.ms-v3-header {
  background:
    linear-gradient(180deg, rgba(8,9,13,.92), rgba(8,9,13,.78));
  -webkit-backdrop-filter: blur(18px) saturate(138%);
  backdrop-filter: blur(18px) saturate(138%);
  box-shadow: 0 12px 34px -30px rgba(0,0,0,.92);
}

.ms-v3-header.is-scrolled {
  background: rgba(7,8,11,.94);
  box-shadow: 0 18px 44px -30px rgba(0,0,0,.96), inset 0 -1px 0 rgba(255,255,255,.025);
}

.ms-v3-menu-trigger {
  background:
    radial-gradient(circle at 30% 18%, rgba(255,255,255,.08), transparent 36%),
    rgba(255,255,255,.035);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 10px 24px rgba(0,0,0,.18);
}

.ms-v3-header-signal {
  background: linear-gradient(180deg, var(--ms-v3-cyan), var(--ms-v3-violet));
  box-shadow: 0 0 14px rgba(100,216,255,.62);
}

.ms-v3-scales-page,
.ms-v3-library-page,
.ms-v3-music-workspace,
.ms-songs-page {
  position: relative;
  isolation: isolate;
}

.dark .ms-v3-scales-page::before,
.dark .ms-v3-library-page::before,
.dark .ms-v3-music-workspace::before,
.dark .ms-songs-page::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(54% 32% at 12% 4%, rgba(84,104,255,.09), transparent 70%),
    radial-gradient(44% 30% at 92% 26%, rgba(62,195,255,.045), transparent 72%),
    #07080b;
}

.ms-v3-scales-page > div:first-child {
  position: relative;
  padding: 20px;
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 28px;
  background: linear-gradient(145deg, rgba(19,21,29,.78), rgba(9,10,14,.62));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 26px 70px -48px rgba(0,0,0,.9);
}

.ms-v3-scales-page > div:first-child::before {
  content: "";
  position: absolute;
  left: 20px;
  top: 0;
  width: 120px;
  height: 1px;
  background: linear-gradient(90deg, var(--ms-v3-cyan), transparent);
}

.ms-v3-scales-page [role="tablist"] {
  padding: 4px !important;
  border-radius: 16px !important;
  border-color: rgba(255,255,255,.065) !important;
  background: rgba(255,255,255,.025) !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.025) !important;
}

.ms-v3-scales-page [role="tab"][aria-selected="true"] {
  background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04)) !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 24px rgba(0,0,0,.16) !important;
}

.dark .ms-v3-scale-card {
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
  border-color: rgba(255,255,255,.065) !important;
  background:
    radial-gradient(80% 130% at 0% 0%, rgba(103,119,255,.055), transparent 62%),
    linear-gradient(145deg, rgba(18,19,26,.94), rgba(9,10,14,.96)) !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 24px 58px -42px rgba(0,0,0,.94) !important;
}

.dark .ms-v3-scale-card:hover {
  border-color: rgba(119,142,255,.18) !important;
  background:
    radial-gradient(80% 130% at 0% 0%, rgba(103,119,255,.085), transparent 62%),
    linear-gradient(145deg, rgba(22,23,31,.98), rgba(11,12,17,.98)) !important;
}

.ms-v3-library-page > div:first-child {
  padding-top: clamp(38px, 6vw, 70px) !important;
  padding-bottom: clamp(34px, 5vw, 58px) !important;
  background:
    radial-gradient(50% 80% at 12% 10%, rgba(89,106,255,.11), transparent 70%),
    radial-gradient(45% 75% at 88% 20%, rgba(65,207,255,.055), transparent 72%),
    linear-gradient(180deg, rgba(10,11,16,.96), rgba(7,8,11,.98)) !important;
  border-bottom-color: rgba(255,255,255,.055) !important;
}

.ms-v3-library-page > div:first-child h1 {
  font-size: clamp(2.35rem, 5.6vw, 4.5rem) !important;
  letter-spacing: -.06em !important;
  line-height: .98 !important;
}

.ms-v3-library-page > div:first-child p {
  max-width: 680px;
}

.ms-v3-library-page [class*="backdrop-blur-xl"],
.ms-v3-library-page [class*="backdrop-blur-2xl"],
.ms-v3-library-page [class*="backdrop-blur-3xl"] {
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
}

.ms-v3-music-workspace .ms-panel,
.ms-songs-page [class*="rounded"] {
  transition: border-color 180ms cubic-bezier(.16,1,.3,1), transform 180ms cubic-bezier(.16,1,.3,1), background 180ms ease;
}

.dark .ms-v3-music-workspace .ms-panel {
  border-color: rgba(255,255,255,.065) !important;
  background:
    radial-gradient(70% 100% at 0% 0%, rgba(100,116,255,.045), transparent 70%),
    linear-gradient(180deg, rgba(17,18,24,.94), rgba(9,10,14,.96)) !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 22px 58px -44px rgba(0,0,0,.94);
}

.ms-v3-music-workspace input[type="search"],
.ms-songs-page input[type="search"] {
  border-radius: 15px !important;
  border-color: rgba(255,255,255,.075) !important;
  background: rgba(4,5,8,.66) !important;
}

@media (max-width: 767px) {
  .ms-v3-header {
    -webkit-backdrop-filter: blur(14px) saturate(128%);
    backdrop-filter: blur(14px) saturate(128%);
  }

  .ms-v3-scales-page {
    padding-top: 18px !important;
    padding-left: 14px !important;
    padding-right: 14px !important;
  }

  .ms-v3-scales-page > div:first-child {
    padding: 16px;
    border-radius: 24px;
  }

  .ms-v3-library-page > div:first-child {
    padding-left: 18px !important;
    padding-right: 18px !important;
  }

  .ms-v3-library-page > div:first-child h1 {
    font-size: 2.55rem !important;
  }

  .ms-v3-music-workspace {
    padding-inline: 2px;
  }
}
'''
          css.write_text(text)

          Path('.github/workflows/premium-v3-surfaces-patch.yml').unlink()
          PY

      - name: Commit surface transformation
        run: |
          git config user.name "prdanielcunha"
          git config user.email "pastordanielpcunha@gmail.com"
          git add pages/ScalesPage.tsx pages/LibraryPage.tsx pages/ChordsPage.tsx pages/LyricsPage.tsx experience-v3.css .github/workflows/premium-v3-surfaces-patch.yml
          git commit -m "feat: extend MusicScale V3 across musical workspaces"
          git push origin HEAD:feat/premium-v2-experience-20260913-final
