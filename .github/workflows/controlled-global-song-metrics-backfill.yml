name: Controlled Global Song Metrics Backfill

on:
  workflow_dispatch:
    inputs:
      authorized_sha:
        description: "Exact production commit SHA approved for this one-shot bounded backfill"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: controlled-global-song-metrics-backfill-millionsnest
  cancel-in-progress: false

jobs:
  controlled_backfill:
    # The caller is deliberately a tiny dispatcher. The privileged work occurs
    # in the reusable workflow below, exposing job_workflow_ref and
    # job_workflow_sha to the WIF provider for immutable trust binding.
    if: github.ref == 'refs/heads/production'
    uses: ./.github/workflows/controlled-global-song-metrics-backfill-executor.yml
    with:
      authorized_sha: ${{ inputs.authorized_sha }}
    permissions:
      contents: read
      id-token: write
