name: Controlled Global Song Metrics Backfill

on:
  workflow_dispatch:
    inputs:
      authorized_sha:
        description: "Exact production commit SHA approved for this one-shot bounded backfill"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: controlled-global-song-metrics-backfill-millionsnest
  cancel-in-progress: false

jobs:
  controlled_backfill:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    environment: firebase-production
    steps:
      - name: Check dispatched SHA
        env:
          AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
          DISPATCHED_SHA: ${{ github.sha }}
        run: |
          test "${#AUTHORIZED_SHA}" -eq 40
          test "$AUTHORIZED_SHA" = "$DISPATCHED_SHA"

      - name: Checkout approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Verify checked out SHA
        env:
          AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_SHA"

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate with dedicated direct WIF write identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/github-musicscale-p47/providers/github-production-writer
          audience: //iam.googleapis.com/projects/555464791734/locations/global/workloadIdentityPools/github-musicscale-p47/providers/github-production-writer

      - name: Execute controlled bounded backfill
        env:
          FIREBASE_PROJECT_ID: millionsnest
          GCLOUD_PROJECT: millionsnest
          GOOGLE_CLOUD_PROJECT: millionsnest
          MACHINE_AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
          MACHINE_GITHUB_ENVIRONMENT: firebase-production
        run: npm run machine:global-song-metrics:controlled-backfill
