name: Dependency Audit Diagnostic

on:
  push:
    branches: [ chatgpt/dependency-audit ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependency graph
        run: npm ci

      - name: Apply already-proven critical patch in workspace
        run: npm update websocket-driver --package-lock-only --ignore-scripts

      - name: Snapshot lock before non-forced audit fix
        run: cp package-lock.json /tmp/package-lock-before-audit-fix.json

      - name: Test non-forced package-lock-only audit fix
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          git diff --exit-code -- package.json
          node <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/package-lock-before-audit-fix.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const names = new Set([...Object.keys(before.packages || {}), ...Object.keys(after.packages || {})]);
          const changed = [];
          for (const name of [...names].sort()) {
            const a = before.packages?.[name];
            const b = after.packages?.[name];
            const av = a?.version ?? null;
            const bv = b?.version ?? null;
            if (av !== bv) changed.push({ package: name || '<root>', before: av, after: bv });
          }
          console.log('=== LOCK VERSION CHANGES FROM NON-FORCED AUDIT FIX ===');
          console.log(JSON.stringify(changed, null, 2));
          console.log(`Changed package entries: ${changed.length}`);
          NODE

      - name: Audit production graph after non-forced fix
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-prod-nonforced.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-prod-nonforced.json', 'utf8'));
          console.log('=== PRODUCTION AFTER NON-FORCED FIX ===');
          console.log(JSON.stringify(report.metadata?.vulnerabilities || {}, null, 2));
          const severe = Object.entries(report.vulnerabilities || {})
            .filter(([, item]) => item.severity === 'critical' || item.severity === 'high')
            .map(([name, item]) => ({ name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable, via: item.via }));
          console.log('=== REMAINING HIGH/CRITICAL ===');
          console.log(JSON.stringify(severe, null, 2));
          NODE

      - name: Upload non-forced diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-nonforced-diagnostic
          path: |
            package-lock.json
            audit-prod-nonforced.json
          retention-days: 1
