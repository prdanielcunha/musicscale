name: Dependency Audit Diagnostic

on:
  push:
    branches: [ chatgpt/dependency-audit ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependency graph
        run: npm ci

      - name: Trace critical dependency
        shell: bash
        run: |
          echo '=== BEFORE ==='
          npm explain websocket-driver || true
          npm ls websocket-driver --all || true

      - name: Prove minimal lock refresh
        shell: bash
        run: |
          npm update websocket-driver --package-lock-only --ignore-scripts
          echo '=== PACKAGE-LOCK DIFF ==='
          git diff -- package-lock.json
          echo '=== LOCKED VERSION AFTER UPDATE ==='
          node <<'NODE'
          const lock = require('./package-lock.json');
          console.log(JSON.stringify(lock.packages?.['node_modules/websocket-driver'] || {}, null, 2));
          NODE

      - name: Audit production dependencies after minimal refresh
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-prod-after.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-prod-after.json', 'utf8'));
          console.log('=== PRODUCTION AFTER MINIMAL REFRESH ===');
          console.log(JSON.stringify(report.metadata?.vulnerabilities || {}, null, 2));
          const critical = Object.entries(report.vulnerabilities || {}).filter(([, item]) => item.severity === 'critical');
          console.log('=== CRITICAL ENTRIES ===');
          console.log(JSON.stringify(critical, null, 2));
          NODE

      - name: Upload diagnostic lock and audit
        uses: actions/upload-artifact@v4
        with:
          name: websocket-driver-minimal-refresh
          path: |
            package-lock.json
            audit-prod-after.json
          retention-days: 1
