name: Dependency Audit Diagnostic

on:
  push:
    branches: [ chatgpt/dependency-audit ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Audit all dependencies
        shell: bash
        run: |
          npm audit --json > audit-all.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-all.json', 'utf8'));
          console.log('=== ALL DEPENDENCIES ===');
          console.log(JSON.stringify(report.metadata?.vulnerabilities || {}, null, 2));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              nodes: item.nodes,
              fixAvailable: item.fixAvailable,
              via: item.via
            }, null, 2));
          }
          NODE

      - name: Audit production dependencies only
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-prod.json', 'utf8'));
          console.log('=== PRODUCTION DEPENDENCIES ===');
          console.log(JSON.stringify(report.metadata?.vulnerabilities || {}, null, 2));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              nodes: item.nodes,
              fixAvailable: item.fixAvailable,
              via: item.via
            }, null, 2));
          }
          NODE

      - name: Upload raw audit reports
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-diagnostic
          path: |
            audit-all.json
            audit-prod.json
          retention-days: 1
