name: Register with NestAI
on:
  push:
    branches: ["main", "production"]
    paths:
      - "millionsnest.app.json"
      - ".github/workflows/nestai-register.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('millionsnest.app.json','utf8')); console.log('MANIFEST_JSON_OK')"
      - name: Request GitHub OIDC token for NestAI
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nestai-app-register")"
          TOKEN="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(1); process.stdout.write(x.value)' "$RESPONSE")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Register app with NestAI
        shell: bash
        env:
          NESTAI_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer $NESTAI_OIDC_TOKEN"             -H "Content-Type: application/json"             --data-binary @millionsnest.app.json             https://ai.millionsnest.com/v1/apps/register
          echo
