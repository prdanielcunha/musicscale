name: Validate Dashboard Draft Delete Ownership Fix

on:
  push:
    branches:
      - chatgpt/hotfix-draft-lifecycle-20260912
    paths:
      - 'scripts/apply-home-focus-delete-callback-fix.mjs'
      - '.github/workflows/hotfix-home-focus-provider-fix.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: ${{ !contains(github.event.head_commit.message, '[provider-fix-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/hotfix-draft-lifecycle-20260912
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply source fix
        run: node scripts/apply-home-focus-delete-callback-fix.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript gate
        run: npm run lint
      - name: Full UI regression gate
        run: npm run test:ui
      - name: Dashboard regression gate
        run: npm run test:scale-dashboard
      - name: MusicScale publish cycle gate
        run: npm run test:scale-cycle
      - name: Build gate
        run: npm run build
      - name: Commit validated source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dashboard/HomeFocusCard.tsx pages/DashboardPage.tsx
          git commit -m "fix: keep dashboard draft deletion provider-safe [provider-fix-applied]"
          git push origin HEAD:chatgpt/hotfix-draft-lifecycle-20260912
