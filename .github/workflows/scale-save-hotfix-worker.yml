name: Scale Save Hotfix Worker

on:
  push:
    branches:
      - hotfix/scale-save-0.1.1-beta

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/scale-save-0.1.1-beta
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply surgical hotfix
        run: node scripts/apply-scale-save-hotfix-v2.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Verify visible save failure feedback
        run: npx vitest run tests/unit/scale-save-no-silent-failure.test.ts

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify real Firestore scale-save authorization
        run: npx firebase emulators:exec --project demo-musicscale-global-role-save --only firestore "npx vitest run tests/server/music-scale-global-role-save.test.ts"
        env:
          CI: true
          GCLOUD_PROJECT: demo-musicscale-global-role-save
          GOOGLE_CLOUD_PROJECT: demo-musicscale-global-role-save

      - name: Build application
        run: npm run build

      - name: Commit verified hotfix and remove temporary worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Hotfix Worker'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/scale-save-hotfix-worker.yml scripts/apply-scale-save-hotfix.mjs scripts/apply-scale-save-hotfix-v2.mjs
          git add firestore.rules contexts/ModalContext.tsx locales/pt.json locales/en.json locales/es.json package.json package-lock.json tests/server/music-scale-global-role-save.test.ts tests/unit/scale-save-no-silent-failure.test.ts
          git commit -m 'fix(scales): restore reliable authorized scale saving'
          git push origin HEAD:hotfix/scale-save-0.1.1-beta
