name: Global Song Metrics Machine Dry Run

on:
  workflow_dispatch:
    inputs:
      authorized_sha:
        description: "Exact commit SHA approved for this read-only execution"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: global-song-metrics-machine-dry-run-millionsnest
  cancel-in-progress: false

jobs:
  dry_run:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    environment: firebase-production
    steps:
      - name: Check dispatched SHA
        env:
          AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
          DISPATCHED_SHA: ${{ github.sha }}
        run: |
          test "${#AUTHORIZED_SHA}" -eq 40
          test "$AUTHORIZED_SHA" = "$DISPATCHED_SHA"

      - name: Checkout approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Verify checked out SHA
        env:
          AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_SHA"

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MILLIONSNEST }}

      - name: Execute read-only global-song metrics dry run
        env:
          FIREBASE_PROJECT_ID: millionsnest
          GCLOUD_PROJECT: millionsnest
          GOOGLE_CLOUD_PROJECT: millionsnest
        run: npm run machine:global-song-metrics:dry-run
