name: reviewer-high-attestor
on:
  workflow_dispatch:
    inputs:
      decision: { required: true, type: string }
      target_sha: { required: true, type: string }
      authorized_sha: { required: true, type: string }
      workflow_path: { required: true, type: string }
      workflow_ref: { required: true, type: string }
      target_ref: { required: true, type: string }
permissions: { contents: read, statuses: write }
jobs:
  attest:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions: { contents: read, statuses: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: ${{ github.sha }}, persist-credentials: false }
      - uses: actions/setup-node@1e60f620b9541d9d376f7ce5e8508d9e5c4b66d4 # v4.0.4
        with: { node-version: 22 }
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_DECISION: ${{ inputs.decision }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          INPUT_AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
          INPUT_WORKFLOW_PATH: ${{ inputs.workflow_path }}
          INPUT_WORKFLOW_REF: ${{ inputs.workflow_ref }}
          INPUT_TARGET_REF: ${{ inputs.target_ref }}
        run: node scripts/reviewer-high-attestor.mjs
