name: MusicScale QA Automation

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]
  workflow_dispatch:

concurrency:
  group: musicscale-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies and refresh lock for Firebase fix validation
      run: npm install

    - name: Verify Firebase versions
      run: npm ls firebase @firebase/firestore

    - name: Upload generated package lock
      uses: actions/upload-artifact@v4
      with:
        name: package-lock-generated
        path: package-lock.json
        retention-days: 7

    - name: Lint and Type Check
      run: npx tsc --noEmit

    - name: Run Vitest Unit & UI Tests
      run: npm run test:ui

    - name: Run Critical Server Scale Release Tests
      run: npm run test:scale-release

    - name: Run Core Server Release Tests
      run: npm run test:release:core

    - name: Build Application
      run: npm run build

    - name: Set up Java for Firebase Emulator
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run E2E bootstrap smoke then full QA suite
      run: >-
        npx firebase emulators:exec --project demo-musicscale --only auth,firestore
        "npm run test:emulator:global-search &&
        npm run test:emulator:security &&
        npx playwright test tests/e2e/01-bootstrap-dashboard.spec.ts
        --project=desktop-chromium
        --project=mobile-chromium
        --project=mobile-webkit
        --project=tablet-webkit &&
        npm run test:e2e:run"
      env:
        CI: true
        GCLOUD_PROJECT: demo-musicscale
        GOOGLE_CLOUD_PROJECT: demo-musicscale

    - name: Upload Playwright JSON Result
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-json
        path: playwright-results.json
        retention-days: 30

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Visual Evidence Artifacts
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: e2e-artifacts
        path: tests/e2e/artifacts/
        retention-days: 30

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: test-results/
        retention-days: 30
