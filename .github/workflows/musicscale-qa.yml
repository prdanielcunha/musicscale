name: MusicScale QA Automation

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musicscale-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  connect-route-patch:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/connect-next-schedule-read-tool-01' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0
        persist-credentials: true

    - name: Mount canonical Connect next-schedule route
      run: |
        python - <<'PY'
        from pathlib import Path

        path = Path('server.ts')
        text = path.read_text()

        import_anchor = 'import { resolveOrganizationAuthorization } from "./services/server/organizationAuthorization.js";'
        import_line = 'import { createConnectNextScheduleReadHandler } from "./services/server/connect/nextScheduleReadHandler.js";'
        if import_line not in text:
            if import_anchor not in text:
                raise SystemExit('authorization import anchor not found')
            text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)

        route_marker = 'app.get("/api/v1/connect/next-schedule"'
        route_block = (
            '\n\n// Connect read-only Tool Gateway boundary. Authentication, tenant and scales.read\n'
            '// are independently revalidated inside MusicScale before any tenant data is read.\n'
            'const connectNextScheduleReadHandler = createConnectNextScheduleReadHandler({\n'
            '  db,\n'
            '  auth,\n'
            '  logger,\n'
            '});\n'
            'app.get("/api/v1/connect/next-schedule", connectNextScheduleReadHandler);\n'
        )
        if route_marker not in text:
            anchor = '  app.post("/api/admin/backfill-global-titles", requireEcosystemRole, async (req: any, res: any) => {'
            if anchor not in text:
                raise SystemExit('route insertion anchor not found')
            text = text.replace(anchor, route_block + '\n' + anchor, 1)

        path.write_text(text)
        PY

    - name: Commit route mount to feature branch
      run: |
        if git diff --quiet; then
          echo "Route already mounted."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add server.ts
        git commit -m "feat(connect): mount next-schedule read tool [route-patch]"
        git push origin HEAD:${{ github.head_ref }}

  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies and refresh lock for Firebase fix validation
      run: npm install

    - name: Verify Firebase versions
      run: npm ls firebase @firebase/firestore

    - name: Upload generated package lock
      uses: actions/upload-artifact@v4
      with:
        name: package-lock-generated
        path: package-lock.json
        retention-days: 7

    - name: Lint and Type Check
      run: npx tsc --noEmit

    - name: Sales truth, pricing authority, and i18n contract
      run: npx tsx scripts/test_musicscale_sales_truth.ts

    - name: Vercel deployment cost policy
      run: npx tsx scripts/test_vercel_deployment_policy.ts

    - name: Firebase Hosting and Cloud Run migration contract
      run: npx tsx scripts/test_firebase_hosting_cloudrun_policy.ts

    - name: Run Vitest Unit & UI Tests
      run: npm run test:ui

    - name: Run Critical Server Scale Release Tests
      run: npm run test:scale-release

    - name: Run Core Server Release Tests
      run: npm run test:release:core

    - name: Build Application
      run: npm run build

    - name: Set up Java for Firebase Emulator
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run E2E Bootstrap Smoke - All Browsers
      run: >-
        npx firebase emulators:exec --project demo-musicscale --only auth,firestore
        "npx playwright test tests/e2e/01-bootstrap-dashboard.spec.ts
        --project=desktop-chromium
        --project=mobile-chromium
        --project=mobile-webkit
        --project=tablet-webkit"
      env:
        CI: true
        GCLOUD_PROJECT: demo-musicscale
        GOOGLE_CLOUD_PROJECT: demo-musicscale

    - name: Run Full E2E QA Suite
      run: >-
        npx firebase emulators:exec --project demo-musicscale --only auth,firestore
        "npm run test:emulator:global-search &&
        npm run test:emulator:security &&
        npm run test:e2e:run"
      env:
        CI: true
        GCLOUD_PROJECT: demo-musicscale
        GOOGLE_CLOUD_PROJECT: demo-musicscale

    - name: Upload Playwright JSON Result
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-json
        path: playwright-results.json
        retention-days: 30

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Visual Evidence Artifacts
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: e2e-artifacts
        path: tests/e2e/artifacts/
        retention-days: 30

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: test-results/
        retention-days: 30

  functions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Node.js 22 for Functions
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json

    - name: Install Functions dependencies
      run: npm ci --prefix functions

    - name: Lint Functions
      run: npm --prefix functions run lint

    - name: Test Functions
      run: npm --prefix functions test

    - name: Build Functions
      run: npm --prefix functions run build
