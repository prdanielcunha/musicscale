name: MS-QA-AUTO-01
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - production
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Use Java 17 for Firebase Emulators
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Run Lint
        run: npm run lint

      - name: Run Build
        run: npm run build

      - name: Run Existing Tests
        run: npm run test:ui

      - name: Run E2E Tests with Firebase Emulator
        run: firebase emulators:exec --only auth,firestore "npx playwright test"
        env:
          VITE_E2E_MODE: 'true'
          VITE_USE_FIREBASE_EMULATOR: 'true'
          FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:9099'
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## MS-QA-AUTO-01 Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "SHA: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build and Linter: Executed" >> $GITHUB_STEP_SUMMARY
          echo "- Playwright UI Tests: Executed" >> $GITHUB_STEP_SUMMARY
          echo "View Artifacts for visual evidence and HTML reports." >> $GITHUB_STEP_SUMMARY

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results & Visual Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
