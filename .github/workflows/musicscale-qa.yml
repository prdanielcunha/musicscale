name: MusicScale QA Automation

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musicscale-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa-core:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Require a new version for production promotion
      if: github.event_name == 'pull_request' && github.base_ref == 'production'
      run: |
        git fetch --no-tags origin production
        node scripts/check-release-version.mjs

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies and refresh lock for Firebase fix validation
      run: npm install

    - name: Verify Firebase versions
      run: npm ls firebase @firebase/firestore

    - name: Upload generated package lock
      uses: actions/upload-artifact@v4
      with:
        name: package-lock-generated
        path: package-lock.json
        retention-days: 7

    - name: Lint and Type Check
      run: npx tsc --noEmit

    - name: Sales truth, pricing authority, and i18n contract
      run: npx tsx scripts/test_musicscale_sales_truth.ts

    - name: Vercel deployment cost policy
      run: npx tsx scripts/test_vercel_deployment_policy.ts

    - name: Firebase Hosting and Cloud Run migration contract
      run: npx tsx scripts/test_firebase_hosting_cloudrun_policy.ts

    - name: Run Vitest Unit & UI Tests
      run: |
        mkdir -p test-results
        set -o pipefail
        npm run test:ui 2>&1 | tee test-results/vitest.log

    - name: Run Critical Server Scale Release Tests
      run: npm run test:scale-release

    - name: Run Core Server Release Tests
      run: npm run test:release:core

    - name: Build Application
      run: npm run build

    - name: Set up Java for Firebase Emulator
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run E2E Bootstrap Smoke - All Browsers
      run: >-
        npx firebase emulators:exec --project demo-musicscale --only auth,firestore
        "npx playwright test tests/e2e/01-bootstrap-dashboard.spec.ts
        --project=desktop-chromium
        --project=mobile-chromium
        --project=mobile-webkit
        --project=tablet-webkit"
      env:
        CI: true
        GCLOUD_PROJECT: demo-musicscale
        GOOGLE_CLOUD_PROJECT: demo-musicscale

    - name: Run E2E Rules - Global Search
      run: >-
        npx firebase emulators:exec --project demo-musicscale --only auth,firestore
        "npm run test:emulator:global-search"
      env:
        CI: true
        GCLOUD_PROJECT: demo-musicscale
        GOOGLE_CLOUD_PROJECT: demo-musicscale

    - name: Run E2E Rules - MusicScale Security
      run: >-
        npx firebase emulators:exec --project demo-musicscale --only auth,firestore
        "npx vitest run tests/server/music-scale-security-rules.test.ts"
      env:
        CI: true
        GCLOUD_PROJECT: demo-musicscale
        GOOGLE_CLOUD_PROJECT: demo-musicscale

    - name: Run E2E Rules - Public Analytics Security
      run: >-
        npx firebase emulators:exec --project demo-musicscale --only auth,firestore
        "npx vitest run tests/server/public-analytics-security-rules.test.ts"
      env:
        CI: true
        GCLOUD_PROJECT: demo-musicscale
        GOOGLE_CLOUD_PROJECT: demo-musicscale

    - name: Run E2E Rules - Live Conductor
      run: >-
        npx firebase emulators:exec --project demo-musicscale --only auth,firestore
        "npx vitest run tests/server/live-conductor-rules.test.ts"
      env:
        CI: true
        GCLOUD_PROJECT: demo-musicscale
        GOOGLE_CLOUD_PROJECT: demo-musicscale

    - name: Run E2E Rules - Global Role Save
      run: >-
        npx firebase emulators:exec --project demo-musicscale --only auth,firestore
        "npx vitest run tests/server/music-scale-global-role-save.test.ts"
      env:
        CI: true
        GCLOUD_PROJECT: demo-musicscale
        GOOGLE_CLOUD_PROJECT: demo-musicscale

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results-core
        path: test-results/
        retention-days: 30

  full-e2e:
    needs: qa-core
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chromium
          - mobile-chromium
          - mobile-webkit
          - tablet-webkit
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Set up Java for Firebase Emulator
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Full Playwright E2E - ${{ matrix.project }}
      run: >-
        npx firebase emulators:exec --project demo-musicscale --only auth,firestore
        "npx playwright test --project=${{ matrix.project }}"
      env:
        CI: true
        GCLOUD_PROJECT: demo-musicscale
        GOOGLE_CLOUD_PROJECT: demo-musicscale

    - name: Upload Playwright JSON Result
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-json-${{ matrix.project }}
        path: playwright-results.json
        if-no-files-found: ignore
        retention-days: 30

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.project }}
        path: playwright-report/
        if-no-files-found: ignore
        retention-days: 30

    - name: Upload Visual Evidence Artifacts
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: e2e-artifacts-${{ matrix.project }}
        path: tests/e2e/artifacts/
        if-no-files-found: ignore
        retention-days: 30

    - name: Upload Playwright Test Results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results-${{ matrix.project }}
        path: test-results/
        if-no-files-found: ignore
        retention-days: 30

  test:
    needs: [qa-core, full-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Verify complete QA gate
      env:
        CORE_RESULT: ${{ needs.qa-core.result }}
        E2E_RESULT: ${{ needs.full-e2e.result }}
      run: |
        echo "qa-core=$CORE_RESULT"
        echo "full-e2e=$E2E_RESULT"
        test "$CORE_RESULT" = "success"
        test "$E2E_RESULT" = "success"

  functions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Node.js 22 for Functions
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json

    - name: Install Functions dependencies
      run: npm ci --prefix functions

    - name: Lint Functions
      run: npm --prefix functions run lint

    - name: Test Functions
      run: npm --prefix functions test

    - name: Build Functions
      run: npm --prefix functions run build
