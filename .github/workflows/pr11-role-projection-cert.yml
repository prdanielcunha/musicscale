name: PR11 Role Projection Certification

on:
  push:
    branches:
      - certify/pr11-role-projection-4441547

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: 4441547ff6ef3ce7bb929cf73967343da0e7e36e
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4441547ff6ef3ce7bb929cf73967343da0e7e36e"
          test -z "$(git status --porcelain=v1)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Firestore Emulator security certification
        run: npx firebase emulators:exec --project demo-musicscale-rules --only firestore "npm run test:emulator:security"

      - name: Projection unit certification
        run: npx vitest run tests/server/music-scale-member-projection.test.ts --reporter=default

      - name: Users compatibility certification
        run: npx vitest run tests/server/music-scale-member-projection.test.ts tests/ui/users-existing-member-setup-integration.test.tsx tests/ui/users-team-setup-progress-integration.test.tsx --reporter=default

      - name: AI authorization certification
        run: npx tsx scripts/test_phase0_2c1a_ai_authorization.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Final hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1)"
          test "$(git rev-parse HEAD)" = "4441547ff6ef3ce7bb929cf73967343da0e7e36e"
